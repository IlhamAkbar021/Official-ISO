  function toggleActionMenu(event, menuId) {
    event.stopPropagation();
    var allMenus = document.querySelectorAll('.dropdown-menu');
    allMenus.forEach(function(m) { if (m.id !== 'menu_' + menuId) m.classList.remove('show'); });
    var menu = document.getElementById('menu_' + menuId);
    if (menu) {
      var willOpen = !menu.classList.contains('show');
      menu.classList.toggle('show', willOpen);
      if (willOpen) {
        var trigger = event.currentTarget || event.target;
        var rect = trigger.getBoundingClientRect();
        menu.style.position = 'fixed';
        menu.style.right = 'auto';
        menu.style.left = Math.max(6, rect.right - 145) + 'px';
        menu.style.top = (rect.bottom + 5) + 'px';
        menu.style.zIndex = '100000';
      } else {
        menu.removeAttribute('style');
      }
    }
  }

  document.addEventListener('click', function() {
    document.querySelectorAll('.dropdown-menu').forEach(function(m) { m.classList.remove('show'); });
  });

  function deleteFromDropdown(type, index) {
    document.querySelectorAll('.dropdown-menu').forEach(function(m) { m.classList.remove('show'); });
    var moduleKey = type === 'wifi' ? 'Wi-Fi' : (type === 'lidar_acc' ? 'LiDAR Accuracy' : 'LiDAR Tilt');
    openDeleteConfirm(moduleKey, index, function() {
      var toast = document.getElementById('copyToast');
      toast.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-top-color:#ffffff;"></div> <span style="margin-left:4px;">Deleting...</span>';
      toast.style.display = 'flex';
      if (type === 'wifi') google.script.run.withSuccessHandler(function(){ toast.style.display='none'; loadCurrentTab(); }).deleteWifiRecord({ rowIndex: index });
      else google.script.run.withSuccessHandler(function(){ toast.style.display='none'; loadCurrentTab(); }).deleteLidarRecord({ rowIndex: index, lidarType: (type === 'lidar_acc' ? 'accuracy' : 'tilt') });
    });
  }

  function copyRowData(type, index) {
    document.querySelectorAll('.dropdown-menu').forEach(function(m) { m.classList.remove('show'); });
    var textToCopy = '';
    if (type === 'wifi') {
      var row = rawWifiResponse.rows[index] || [];
      textToCopy = row.map(function(c) { return (c||'').toString().trim(); }).join('\t');
    } else if (type === 'lidar_acc') {
      var r1 = rawLidarResponse.accuracy.rows[index] || [], r2 = rawLidarResponse.accuracy.rows[index+1] || [], r3 = rawLidarResponse.accuracy.rows[index+2] || [];
      textToCopy = r1.join('\t') + '\n' + r2.join('\t') + '\n' + r3.join('\t');
    } else if (type === 'lidar_tilt') {
      var row = rawLidarResponse.tilt.rows[index] || [];
      textToCopy = row.map(function(c) { return (c||'').toString().trim(); }).join('\t');
    }
    navigator.clipboard.writeText(textToCopy).then(function() {
      var toast = document.getElementById('copyToast');
      toast.innerHTML = '<span style="color:#22c55e; font-weight:800;">✔</span> <span style="margin-left:4px;">' + t('copied') + '</span>';
      toast.style.display = 'flex';
      setTimeout(function() { toast.style.display = 'none'; }, 2200);
    });
  }

  function showError(error) {
    setSyncState('Database unavailable', 'error');
    document.getElementById('tableContainer').innerHTML = '<div class="panel-card"><div style="color:#ef4444; padding:2rem; text-align:center;">Database connection interrupted.</div></div>';
  }

  function openInputModal() {
    isEditing = false;
    activeEditRowIndex = null;
    activeModuleOriginalRow = null;
    var deleteBtn = document.getElementById('deleteBtn');
    var saveBtn = document.getElementById('saveBtn');
    if (deleteBtn) deleteBtn.style.display = 'none';
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerText = 'Save Record'; }

    if (isGenericModule(currentTab) && rawModuleResponse) {
      openInlineGenericRecord();
      return;
    }
    if (currentTab === 'wifi') renderWifiModal();
    else if (currentTab === 'lidar') renderLidarModal();
    else if (isGenericModule(currentTab) && rawModuleResponse) renderGenericModuleModal();
    else return;
    document.getElementById('inputModal').style.display = 'flex';
  }

  var inlineRecordActive = false;

  function getModuleColumnOptions(columnIndex) {
    var values = {};
    (rawModuleResponse.rows || []).forEach(function(row) {
      var value = String(row[columnIndex] || '').trim();
      if (value) values[value] = true;
    });
    var testerColumn = rawModuleResponse.roles && rawModuleResponse.roles.tester >= 0 ? rawModuleResponse.roles.tester : -1;
    if (columnIndex === testerColumn) {
      getRegisteredTesterNames().forEach(function(name) { values[name] = true; });
    }
    return Object.keys(values).sort();
  }

  function getRegisteredTesterNames() {
    return registeredTesterNames.slice();
  }

  function loadRegisteredTesterNames(onComplete) {
    google.script.run.withSuccessHandler(function(names) {
      registeredTesterNames = Array.isArray(names) ? names.filter(Boolean) : [];
      localStorage.setItem('registered_testers_cache', JSON.stringify(registeredTesterNames));
      hydrateRegisteredTesterList();
      if (onComplete) onComplete(registeredTesterNames);
    }).withFailureHandler(function() {
      try {
        registeredTesterNames = JSON.parse(localStorage.getItem('registered_testers_cache') || '[]');
      } catch (e) { registeredTesterNames = []; }
      hydrateRegisteredTesterList();
      if (onComplete) onComplete(registeredTesterNames);
    }).getRegisteredTesterNames();
  }

  function hydrateRegisteredTesterList() {
    var list = document.getElementById('registeredTesterList');
    if (!list) return;
    list.innerHTML = getRegisteredTesterNames().map(function(name) { return '<option value="' + escapeHtml(name) + '"></option>'; }).join('');
  }

  function openInlineGenericRecord() {
    if (inlineRecordActive) return;
    var body = document.getElementById('genericModuleTableBody');
    if (!body) return;
    inlineRecordActive = true;
    var headers = rawModuleResponse.headers || [];
    var robotColumn = rawModuleResponse.roles && rawModuleResponse.roles.robot >= 0 ? rawModuleResponse.roles.robot : 0;
    var testerColumn = rawModuleResponse.roles && rawModuleResponse.roles.tester >= 0 ? rawModuleResponse.roles.tester : -1;
    var html = '<tr class="inline-add-row">';
    headers.forEach(function(header, index) {
      var options = (index === robotColumn || index === testerColumn) ? getModuleColumnOptions(index) : [];
      var headDepthImageColumn = rawModuleResponse.key === 'headdepth' && index >= 7 && index <= 9;
      if (headDepthImageColumn) {
        html += '<td class="inline-image-add-cell"><select class="inline-record-field head-depth-image-choice" data-column="' + index + '" onchange="toggleHeadDepthImageInput(this)"><option value="">Select…</option><option value="undetected">Undetected</option><option value="import">Import image</option></select><input class="head-depth-image-file" data-image-column="' + index + '" type="file" accept="image/*" onchange="readHeadDepthImage(this)"></td>';
      } else if (options.length) {
        var customRobotOption = index === robotColumn ? '<option value="__custom__">Custom robot…</option>' : '';
        var customHandler = index === robotColumn ? ' onchange="toggleCustomRobotInput(this)"' : '';
        html += '<td><select class="inline-record-field" data-column="' + index + '"' + customHandler + '><option value="">Select…</option>' + options.map(function(option) { return '<option value="' + escapeHtml(option) + '">' + escapeHtml(option) + '</option>'; }).join('') + customRobotOption + '</select>' + (index === robotColumn ? '<input class="custom-robot-input" type="text" placeholder="Type Robot ID" data-custom-robot-for="' + index + '">' : '') + '</td>';
      } else {
        html += '<td><input class="inline-record-field" data-column="' + index + '" type="text" placeholder="' + escapeHtml(getFriendlyModuleHeader(header, index, rawModuleResponse.key)) + '"></td>';
      }
    });
    html += '<td class="module-action-cell"><button type="button" class="inline-save-button" onclick="saveInlineGenericRecord()">Save</button><button type="button" class="inline-cancel-button" onclick="cancelInlineGenericRecord()">Cancel</button></td></tr>';
    body.insertAdjacentHTML('afterbegin', html);
    body.parentElement.parentElement.scrollTop = 0;
    var first = body.querySelector('.inline-record-field');
    if (first) first.focus();
  }

  function toggleCustomRobotInput(select) {
    var input = select.parentElement.querySelector('.custom-robot-input');
    if (!input) return;
    input.style.display = select.value === '__custom__' ? 'block' : 'none';
    if (select.value !== '__custom__') input.value = '';
    if (select.value === '__custom__') input.focus();
  }

  function toggleHeadDepthImageInput(select) {
    var input = select.parentElement.querySelector('.head-depth-image-file');
    if (!input) return;
    input.style.display = select.value === 'import' ? 'block' : 'none';
    if (select.value !== 'import') {
      input.value = '';
      delete select.dataset.imageData;
    }
  }

  function readHeadDepthImage(input) {
    var file = input.files && input.files[0];
    var select = input.parentElement.querySelector('.head-depth-image-choice');
    if (!file || !select) return;
    var reader = new FileReader();
    reader.onload = function(event) {
      var image = new Image();
      image.onload = function() {
        var max = 1200, scale = Math.min(1, max / Math.max(image.width, image.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        select.dataset.imageData = canvas.toDataURL('image/jpeg', .82);
        select.options[select.selectedIndex].text = 'Image ready';
      };
      image.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function cancelInlineGenericRecord() {
    var row = document.querySelector('.inline-add-row');
    if (row) row.remove();
    inlineRecordActive = false;
  }

  function saveInlineGenericRecord() {
    var fields = document.querySelectorAll('.inline-add-row .inline-record-field');
    var values = [];
    var robotColumn = rawModuleResponse.roles && rawModuleResponse.roles.robot >= 0 ? rawModuleResponse.roles.robot : 0;
    fields.forEach(function(field) {
      var column = Number(field.dataset.column);
      if (field.classList.contains('head-depth-image-choice')) {
        values[column] = field.value === 'import' ? (field.dataset.imageData || '') : field.value;
      } else {
        values[column] = field.value.trim();
      }
    });
    var customRobot = document.querySelector('.inline-add-row .custom-robot-input');
    var robotSelect = document.querySelector('.inline-add-row select[data-column="' + robotColumn + '"]');
    if (robotSelect && robotSelect.value === '__custom__') values[robotColumn] = customRobot ? customRobot.value.trim() : '';
    if (!values[robotColumn]) { alert('Please select or enter a Robot ID.'); return; }
    var button = document.querySelector('.inline-save-button');
    if (button) { button.disabled = true; button.innerText = 'Saving…'; }
    google.script.run.withSuccessHandler(function(response) {
      if (!response || !response.success) { handleFail(response && response.error ? response.error : 'Save failed.'); return; }
      inlineRecordActive = false;
      localStorage.removeItem('iso_tab_cache_' + rawModuleResponse.key);
      loadCurrentTab();
    }).withFailureHandler(handleFail).appendIsoModuleRecord({
      moduleKey: rawModuleResponse.key,
      sheetName: rawModuleResponse.sheetName,
      values: values
    });
  }

  function renderGenericModuleModal(row, sheetRow) {
    var headers = rawModuleResponse.headers || [];
    var editing = Array.isArray(row);
    document.getElementById('modalTitle').innerText = (editing ? 'Edit ' : 'Add ') + (rawModuleResponse.title || 'ISO record');
    var robotColumn = rawModuleResponse.roles && rawModuleResponse.roles.robot >= 0 ? rawModuleResponse.roles.robot : 0;
    var testerColumn = rawModuleResponse.roles && rawModuleResponse.roles.tester >= 0 ? rawModuleResponse.roles.tester : -1;
    var robotId = editing ? String(row[robotColumn] || 'Record') : '';
    document.getElementById('formBody').innerHTML = (editing ? '<div class="modal-record-context"><span>Robot record</span><strong>' + escapeHtml(robotId) + '</strong><small>Only changed fields will be written to Google Sheets.</small></div>' : '') + '<div class="module-edit-grid">' + headers.map(function(header, index) {
      var label = getFriendlyModuleHeader(header, index, rawModuleResponse.key);
      var required = index === (rawModuleResponse.roles && rawModuleResponse.roles.robot >= 0 ? rawModuleResponse.roles.robot : 0) ? ' required' : '';
      var value = editing ? String(row[index] || '') : '';
      if (editing && isImageCell(value, header, rawModuleResponse.key)) {
        return '<div class="form-group module-image-field"><label>' + escapeHtml(label) + '</label>' + renderImageCell(value, header, sheetRow, index + 1, rawModuleResponse.sheetName) + '<small>Image evidence is managed from Google Sheets.</small></div>';
      }
      var robotList = index === robotColumn ? ' list="registeredRobotList" onfocus="hydrateRegisteredRobotList()"' : '';
      var testerList = index === testerColumn ? ' list="registeredTesterList" onfocus="hydrateRegisteredTesterList()"' : '';
      return '<div class="form-group"><label>' + escapeHtml(label) + '</label><input type="text" name="module_field_' + index + '" value="' + escapeHtml(value) + '" placeholder="Enter ' + escapeHtml(label) + '"' + required + robotList + testerList + '></div>';
    }).join('') + '</div>';
  }

  function hydrateRegisteredRobotList() {
    var list = document.getElementById('registeredRobotList');
    if (!list || list.options.length) return;
    try {
      var names = JSON.parse(localStorage.getItem('registered_robot_names') || '[]');
      list.innerHTML = names.map(function(name) { return '<option value="' + escapeHtml(name) + '"></option>'; }).join('');
    } catch (e) { /* optional */ }
  }

  function submitGenericModuleForm() {
    var values = (rawModuleResponse.headers || []).map(function(_, index) {
      var field = document.querySelector('[name="module_field_' + index + '"]');
      return field ? field.value : '';
    });
    if (isEditing && activeEditRowIndex && activeModuleOriginalRow) {
      var changes = [];
      values.forEach(function(value, index) {
        var field = document.querySelector('[name="module_field_' + index + '"]');
        if (!field) return;
        if (value !== String(activeModuleOriginalRow[index] || '')) changes.push({ column: index + 1, value: value });
      });
      if (!changes.length) { closeInputModal(); return; }
      google.script.run.withSuccessHandler(handleSuccess).withFailureHandler(handleFail).updateIsoModuleCells({
        sheetName: rawModuleResponse.sheetName, moduleKey: rawModuleResponse.key, row: activeEditRowIndex, changes: changes
      });
    } else {
      google.script.run.withSuccessHandler(handleSuccess).withFailureHandler(handleFail).appendIsoModuleRecord({
        sheetName: rawModuleResponse.sheetName, moduleKey: rawModuleResponse.key, values: values
      });
    }
  }

  function closeInputModal() {
    document.getElementById('inputModal').style.display = 'none';
    isEditing = false;
    activeEditRowIndex = null;
    activeModuleOriginalRow = null;
  }

  function handleSuccess(response) {
    var saveBtn = document.getElementById('saveBtn');
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerText = 'Save Record'; }
    if (!response || response.success === false) {
      handleFail(response && response.error ? response.error : 'The record could not be saved.');
      return;
    }
    closeInputModal();
    var toast = document.getElementById('copyToast');
    toast.innerHTML = '<span style="color:#34d399;font-weight:800;">✓</span><span>Record synchronized</span>';
    toast.style.display = 'flex';
    setTimeout(function() { toast.style.display = 'none'; }, 2200);
    loadCurrentTab();
  }

  function handleFail(error) {
    var saveBtn = document.getElementById('saveBtn');
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerText = 'Save Record'; }
    var toast = document.getElementById('copyToast');
    toast.innerHTML = '<span style="color:#fca5a5;font-weight:800;">!</span><span>' + escapeHtml('Save error: ' + (error && error.message ? error.message : error)) + '</span>';
    toast.style.display = 'flex';
    setTimeout(function() { toast.style.display = 'none'; }, 3600);
  }

  function confirmDeleteRecord() {
    if (activeEditRowIndex === null) return;
    openDeleteConfirm(currentTab, activeEditRowIndex, function() {
      if (currentTab === 'wifi') {
        google.script.run.withSuccessHandler(handleSuccess).withFailureHandler(handleFail).deleteWifiRecord({ rowIndex: activeEditRowIndex });
      } else if (currentTab === 'lidar') {
        google.script.run.withSuccessHandler(handleSuccess).withFailureHandler(handleFail).deleteLidarRecord({ rowIndex: activeEditRowIndex, lidarType: activeLidarEditType });
      }
    });
  }

  function openSettingsModal() {
    document.getElementById('setting_matrix_title').value = getMatrixTitle();
    document.getElementById('setting_dvt1_label').value = getDvt1Label();
    document.getElementById('setting_dvt2_label').value = getDvt2Label();
    document.getElementById('setting_testers').value = getRegisteredTesterNames().join('\n');
    document.getElementById('setting_lang').value = currentLang;
    hydrateRegisteredTesterList();
    document.getElementById('settingsModal').style.display = 'flex';
    loadRegisteredTesterNames(function(names) {
      document.getElementById('setting_testers').value = names.join('\n');
    });
  }

  function closeSettingsModal() { 
    document.getElementById('settingsModal').style.display = 'none'; 
  }

  function saveSettings(e) {
    e.preventDefault();
    var newTitle = document.getElementById('setting_matrix_title').value.trim();
    var newDvt1 = document.getElementById('setting_dvt1_label').value.trim();
    var newDvt2 = document.getElementById('setting_dvt2_label').value.trim();
    var testerNames = document.getElementById('setting_testers').value.split(/[\n,]+/).map(function(name) { return name.trim(); }).filter(Boolean);
    var uniqueTesters = [];
    testerNames.forEach(function(name) { if (uniqueTesters.indexOf(name) === -1) uniqueTesters.push(name); });
    var newLang = document.getElementById('setting_lang').value;
    
    if (newTitle) localStorage.setItem('custom_matrix_title', newTitle);
    if (newDvt1) localStorage.setItem('custom_dvt1_label', newDvt1);
    if (newDvt2) localStorage.setItem('custom_dvt2_label', newDvt2);
    currentLang = newLang;
    localStorage.setItem('app_lang', newLang);
    
    google.script.run.withSuccessHandler(function(result) {
      registeredTesterNames = result && Array.isArray(result.names) ? result.names : uniqueTesters;
      localStorage.setItem('registered_testers_cache', JSON.stringify(registeredTesterNames));
      hydrateRegisteredTesterList();
      closeSettingsModal();
      applyLanguage();
      loadCurrentTab();
    }).withFailureHandler(function(error) {
      handleFail(error);
    }).saveRegisteredTesterNames(uniqueTesters);
  }

  document.addEventListener('keydown', function(event) {
    var tag = document.activeElement ? document.activeElement.tagName : '';
    if (event.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
      var search = document.getElementById('tableSearchInput');
      if (search && search.offsetParent !== null) {
        event.preventDefault();
        search.focus();
        search.select();
      }
    }
    if (event.key === 'Escape') {
      document.body.classList.remove('mobile-nav-open');
      document.querySelectorAll('.modal-overlay').forEach(function(modal) { modal.style.display = 'none'; });
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
  });

  var prefetchedTabs = {};
  function prefetchModuleTab(tabId) {
    if (!isGenericModule(tabId) || prefetchedTabs[tabId] || tabId === currentTab) return;
    prefetchedTabs[tabId] = true;
    var methods = {
      ratedspeed:'getRatedSpeedData', estop:'getEStopData', turningwidth:'getTurningWidthData',
      clifflowerspeed:'getCliffLowerSpeedData', traversegap:'getTraverseGapData', narrow:'getNarrowCorridorData',
      apriltag:'getAprilTagData', accuracylaser:'getModuleData', accuracyapriltag:'getModuleData'
    };
    var method = methods[tabId] || 'getModuleData';
    var runner = google.script.run.withSuccessHandler(function(response) {
      if (response && response.success) saveTabCache(tabId, { type:'module', data:response });
    }).withFailureHandler(function() { prefetchedTabs[tabId] = false; });
    if (method === 'getModuleData') runner.getModuleData(tabId);
    else runner[method]();
  }

  window.onload = function() {
    applyLanguage();
    loadRegisteredTesterNames();
    toggleSidebarRail(localStorage.getItem('iso_sidebar_rail') === '1');
    collapseAllNavGroups();
    var lastTab = localStorage.getItem('last_iso_tab');
    switchTab(document.getElementById('nav-' + lastTab) ? lastTab : 'overview');
    document.querySelectorAll('.nav-item').forEach(function(item) {
      var tabId = item.id.replace(/^nav-/, '');
      item.addEventListener('mouseenter', function() { prefetchModuleTab(tabId); }, { passive:true });
      item.addEventListener('focus', function() { prefetchModuleTab(tabId); }, { passive:true });
    });
    var imageObserver = new MutationObserver(function() {
      document.querySelectorAll('.sheet-image-thumbnail[data-sheet-name]').forEach(function(image) {
        var src = image.getAttribute('src') || '';
        if (!/^data:image\//i.test(src) && !image.dataset.proxyAttempted && !src) requestSheetImageProxy(image);
      });
    });
    imageObserver.observe(document.getElementById('tableContainer'), { childList: true, subtree: true });
  };
</script>
