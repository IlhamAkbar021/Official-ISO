  function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) ? I18N[currentLang][key] : key; }
  
  function getMatrixTitle() { return localStorage.getItem('custom_matrix_title') || 'Master Test Execution Matrix'; }
  function getRobotFilterLabels() { try { return JSON.parse(localStorage.getItem('custom_robot_filter_labels') || '{}'); } catch (e) { return {}; } }
  function getDvt1Label() { return getRobotFilterLabels().dvt1 || 'AC3110-DVT1'; }
  function getDvt2Label() { return getRobotFilterLabels().dvt2 || 'AC3110-DVT2'; }

  function toggleNavGroup(groupId, headerEl) {
    var group = document.getElementById(groupId);
    if (group) {
      var willOpen = group.classList.contains('collapsed');
      if (willOpen) closeOtherNavGroups(groupId);
      group.classList.toggle('collapsed', !willOpen);
      headerEl.classList.toggle('collapsed', !willOpen);
      headerEl.classList.toggle('section-active', willOpen);
      var toggle = headerEl.querySelector('.nav-section-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', String(willOpen));
    }
  }

  function closeOtherNavGroups(activeGroupId) {
    document.querySelectorAll('.nav-group').forEach(function(group) {
      if (group.id === activeGroupId) return;
      group.classList.add('collapsed');
      var header = group.previousElementSibling;
      if (header && header.classList.contains('nav-section-header')) {
        header.classList.add('collapsed');
        header.classList.remove('section-active');
        var toggle = header.querySelector('.nav-section-toggle');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      }
    });
  }

  function collapseAllNavGroups() {
    document.querySelectorAll('.nav-group').forEach(function(group) {
      group.classList.add('collapsed');
      var header = group.previousElementSibling;
      if (header && header.classList.contains('nav-section-header')) {
        header.classList.add('collapsed');
        header.classList.remove('section-active');
        var toggle = header.querySelector('.nav-section-toggle');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      }
    });
  }

  function toggleSidebarRail(forceCollapsed) {
    var collapsed = typeof forceCollapsed === 'boolean' ? forceCollapsed : !document.body.classList.contains('sidebar-rail');
    document.body.classList.toggle('sidebar-rail', collapsed);
    localStorage.setItem('iso_sidebar_rail', collapsed ? '1' : '0');
    var toggle = document.querySelector('.sidebar-rail-toggle');
    if (toggle) {
      toggle.innerText = collapsed ? '›' : '‹';
      toggle.setAttribute('aria-label', collapsed ? 'Expand navigation' : 'Collapse navigation');
      toggle.title = collapsed ? 'Expand navigation' : 'Collapse navigation';
    }
  }

  function openWorkspace(workspace) {
    openOverviewScope(workspace === 'overview' ? 'all' : workspace);
  }

  function openOverviewScope(scope) {
    var allowed = ['all', 'static', 'dynamic', 'accuracy'];
    if (allowed.indexOf(scope) === -1) scope = 'all';
    window.overviewScope = scope;
    window.overviewTriageFilter = false;
    window.overviewTestFilter = '';
    var savedStatsPreference = localStorage.getItem('overview_stats_' + scope);
    window.overviewShowStatistics = savedStatsPreference === null ? scope !== 'static' : savedStatsPreference === '1';
    localStorage.setItem('overview_scope', scope);
    window.overviewView = scope === 'all' ? 'statistics' : 'matrix';
    switchTab('overview');
    syncOverviewScopeNavigation(scope);
    var title = document.getElementById('topHeaderTitle');
    if (title) title.innerText = scope === 'all' ? 'Overview' : (scope === 'static' ? 'Static ISO' : (scope === 'dynamic' ? 'Dynamic ISO' : 'Accuracy & Repeatability'));
  }

  function syncOverviewScopeNavigation(scope) {
    document.querySelectorAll('.nav-section-header.scope-active').forEach(function(header) { header.classList.remove('scope-active'); });
    if (scope && scope !== 'all') {
      var header = document.getElementById('nav-scope-' + scope);
      if (header) header.classList.add('scope-active');
      var overviewButton = document.getElementById('nav-overview');
      if (overviewButton) {
        overviewButton.classList.remove('active');
        overviewButton.removeAttribute('aria-current');
      }
    }
  }

  function updateWorkspaceTabs(tabId) {
    var staticTabs = ['lidar','headdepth','basedepth','cliff','wifi'];
    var dynamicTabs = ['ratedspeed','estop','turningwidth','clifflowerspeed','traversegap','narrow','apriltag'];
    var accuracyTabs = ['accuracylaser','accuracyapriltag'];
    var workspace = tabId === 'overview' || tabId === 'general' ? 'overview' :
      (staticTabs.indexOf(tabId) !== -1 ? 'static' : (dynamicTabs.indexOf(tabId) !== -1 ? 'dynamic' : (accuracyTabs.indexOf(tabId) !== -1 ? 'accuracy' : 'overview')));
    document.querySelectorAll('.workspace-tab').forEach(function(button) {
      var active = button.dataset.workspace === workspace;
      button.classList.toggle('active', active);
      if (active) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
  }

  function switchTab(tabId) {
    // Normalize legacy navigation ids so General Info never routes to Overview.
    if (tabId === 'generalinfo') tabId = 'general';
    if (tabId !== currentTab && inlineRecordActive) discardInlineGenericRecord();
    var sidebarSearch = document.getElementById('sidebarSearchInput');
    if (sidebarSearch && sidebarSearch.value) {
      sidebarSearch.value = '';
      filterSidebarNavigation('');
    }
    if (tabId !== currentTab) {
      searchQuery = '';
      var tabSearch = document.getElementById('tableSearchInput');
      if (tabSearch) tabSearch.value = '';
    }
    currentTab = tabId;
    document.body.classList.toggle('base-depth-viewport', tabId === 'basedepth');
    localStorage.setItem('active_dashboard_tab', tabId);
    if (history.replaceState) history.replaceState(null, null, '#' + tabId);
    else location.hash = tabId;
    if (tabId !== 'overview') syncOverviewScopeNavigation('all');
    var pageScroller = document.querySelector('.content-scroll-area');
    if (pageScroller) pageScroller.classList.toggle('lidar-table-only-scroll', tabId === 'lidar');
    if (pageScroller) pageScroller.classList.toggle('overview-no-global-scroll', tabId === 'overview');
    
    document.querySelectorAll('.nav-item').forEach(function(btn) { btn.classList.remove('active'); });
    var activeBtn = document.getElementById('nav-' + tabId);
    if (activeBtn) {
      activeBtn.classList.add('active');
      activeBtn.setAttribute('aria-current', 'page');
      var parentGroup = activeBtn.closest('.nav-group');
      if (parentGroup) {
        closeOtherNavGroups(parentGroup.id);
        parentGroup.classList.remove('collapsed');
        var groupHeader = parentGroup.previousElementSibling;
        if (groupHeader) {
          groupHeader.classList.remove('collapsed');
          groupHeader.classList.add('section-active');
        }
      } else {
        collapseAllNavGroups();
      }
    }
    document.querySelectorAll('.nav-item:not(.active)').forEach(function(btn) { btn.removeAttribute('aria-current'); });
    localStorage.setItem('last_iso_tab', tabId);
    updateWorkspaceTabs(tabId);

    var activeLabel = activeBtn ? activeBtn.querySelector('.nav-label') : null;
    var topTitle = activeLabel ? activeLabel.innerText.trim() : (activeBtn ? activeBtn.innerText.trim() : 'Dashboard');
    if (tabId === 'overview' && window.overviewScope && window.overviewScope !== 'all') {
      syncOverviewScopeNavigation(window.overviewScope);
      topTitle = window.overviewScope === 'static' ? 'Static ISO' : (window.overviewScope === 'dynamic' ? 'Dynamic ISO' : 'Accuracy & Repeatability');
    }
    document.getElementById('topHeaderTitle').innerText = topTitle;
    var kicker = document.getElementById('headerKicker');
    if (kicker) {
      var staticTabs = ['lidar','headdepth','basedepth','cliff','wifi'];
      var dynamicTabs = ['ratedspeed','estop','turningwidth','clifflowerspeed','traversegap','narrow','apriltag'];
      kicker.innerText = tabId === 'overview' ? 'EXECUTION OVERVIEW' : (staticTabs.indexOf(tabId) !== -1 ? 'STATIC ISO' : (dynamicTabs.indexOf(tabId) !== -1 ? 'DYNAMIC ISO' : 'ACCURACY & REPEATABILITY'));
    }
    document.body.classList.remove('mobile-nav-open');

    var cBar = document.getElementById('controlsBar');
    var headerTools = document.getElementById('headerTools');
    if (cBar) {
      var hasSubTabs = tabId === 'lidar';
      if (tabId === 'overview' || tabId === 'general') {
        cBar.style.display = 'none';
        if (headerTools) headerTools.style.display = 'none';
      } else {
        cBar.style.display = hasSubTabs ? 'flex' : 'none';
        if (headerTools) headerTools.style.display = 'inline-flex';
        var addBtn = document.getElementById('addRecordBtn');
        var searchInput = document.getElementById('tableSearchInput');
        if (addBtn) {
          if (tabId === 'lidar' && typeof configureLidarAddButton === 'function') {
            configureLidarAddButton(addBtn);
          } else {
            addBtn.style.display = (tabId === 'wifi' || isGenericModule(tabId)) ? 'inline-flex' : 'none';
            addBtn.innerText = '+ Add Record';
            addBtn.setAttribute('onclick', tabId === 'basedepth' ? 'openBaseDepthRecordModal()' : (tabId === 'headdepth' ? 'openHeadDepthRecordModal()' : 'openInputModal()'));
          }
        }
        if (searchInput) searchInput.style.display = 'block';
      }
    }

    renderSubPills();
    loadCurrentTab(true);
  }

  function renderSubPills() {
    var pillsDiv = document.getElementById('subPillsContainer');
    if (currentTab === 'lidar') {
      pillsDiv.innerHTML = 
        '<div class="sub-pills lidar-view-toggle" role="tablist" aria-label="LiDAR inspection view">' +
          '<button role="tab" aria-selected="' + (activeLidarSubTab === 'accuracy') + '" class="pill-btn ' + (activeLidarSubTab === 'accuracy' ? 'active' : '') + '" onclick="switchLidarSubTab(\'accuracy\')">Accuracy Collection</button>' +
          '<button role="tab" aria-selected="' + (activeLidarSubTab === 'tilt') + '" class="pill-btn ' + (activeLidarSubTab === 'tilt' ? 'active' : '') + '" onclick="switchLidarSubTab(\'tilt\')">Tilt &amp; Angle Data</button>' +
        '</div>';
    } else {
      pillsDiv.innerHTML = '';
    }
  }

  function switchLidarSubTab(subTab) {
    if (subTab !== 'accuracy' && subTab !== 'tilt') subTab = 'accuracy';
    activeLidarSubTab = subTab;
    renderSubPills();
    if (rawLidarResponse) renderSplitLidarTable(rawLidarResponse);
  }

  function filterData(query) {
    searchQuery = query.toLowerCase().trim();
    if (currentTab === 'wifi' && rawWifiResponse) renderTable(rawWifiResponse);
    if (currentTab === 'lidar' && rawLidarResponse) renderSplitLidarTable(rawLidarResponse);
    if (isGenericModule(currentTab) && rawModuleResponse) renderSmartModule(rawModuleResponse);
  }

  function focusQuickSearch() {
    var search = document.getElementById('sidebarSearchInput');
    if (!search) return;
    search.focus();
    search.select();
  }

  function filterSidebarNavigation(value) {
    var query = String(value || '').trim().toLowerCase();
    document.body.classList.toggle('sidebar-searching', !!query);
    document.querySelectorAll('.nav-menu > .nav-item').forEach(function(item) {
      item.style.display = !query || item.innerText.toLowerCase().indexOf(query) !== -1 ? 'flex' : 'none';
    });
    document.querySelectorAll('.nav-section-header').forEach(function(header) {
      var group = header.nextElementSibling;
      var headerMatch = !query || header.innerText.toLowerCase().indexOf(query) !== -1;
      var childMatch = false;
      if (group && group.classList.contains('nav-group')) {
        group.querySelectorAll('.nav-item').forEach(function(item) {
          var matches = !query || headerMatch || item.innerText.toLowerCase().indexOf(query) !== -1;
          item.style.display = matches ? 'flex' : 'none';
          if (matches && query) childMatch = true;
        });
      }
      header.style.display = headerMatch || childMatch ? 'flex' : 'none';
    });
  }

  function updateNavSuiteCounts() {
    ['static', 'dynamic', 'accuracy'].forEach(function(scope) {
      var group = document.getElementById('group-' + scope);
      var badge = document.querySelector('#nav-scope-' + scope + ' .badge-count');
      if (!group || !badge) return;
      var count = group.querySelectorAll('.nav-item').length;
      badge.innerText = count;
      badge.title = count + ' modules';
    });
  }

  function toggleLanguage() {
    currentLang = (currentLang === 'en') ? 'zh' : 'en';
    localStorage.setItem('app_lang', currentLang);
    applyLanguage();
    loadCurrentTab();
  }

  function applyLanguage() {
    document.getElementById('langToggleText').innerText = (currentLang === 'en') ? '中文' : 'EN';
    document.getElementById('appMainTitle').innerText = t('app_title');
    
    document.getElementById('nav_txt_overview').innerText = t('nav_overview');
    document.getElementById('nav_txt_general').innerText = t('nav_general');
    document.getElementById('nav_txt_static').innerText = t('nav_static');
    document.getElementById('nav_txt_dynamic').innerText = t('nav_dynamic');
    document.getElementById('nav_txt_accuracy').innerText = t('nav_accuracy');
    document.getElementById('btn_txt_settings').innerText = t('settings');
    var settingText = { settings_title:'settings_title', settings_language_label:'settings_language', settings_matrix_label:'settings_matrix', settings_filter_label:'settings_filters', settings_testers_label:'settings_testers', settings_cancel:'cancel', settings_save:'save_settings' };
    Object.keys(settingText).forEach(function(id) { var element = document.getElementById(id); if (element) element.innerText = t(settingText[id]); });
    var filterHelp = document.getElementById('settings_filter_help'); if (filterHelp) filterHelp.innerText = t('settings_filter_help');

    var searchEl = document.getElementById('tableSearchInput');
    if(searchEl) searchEl.placeholder = t('search_placeholder');
    var refEl = document.getElementById('refreshBtnText');
    if(refEl) refEl.innerText = t('refresh');
    var addEl = document.getElementById('addRecordBtn');
    if(addEl) addEl.innerText = t('add_record');
  }

  function confirmRefresh() {
    var btn = document.getElementById('refreshBtn');
    var text = document.getElementById('refreshBtnText');
    btn.disabled = true;
    text.innerText = 'Syncing…';
    google.script.run.withSuccessHandler(function() {
      loadCurrentTab(true);
    }).withFailureHandler(function() {
      loadCurrentTab(true);
    }).clearStaticIsoCache();
    setTimeout(function() { btn.disabled = false; text.innerText = t('refresh'); }, 900);
  }

  function isGenericModule(tabId) {
    return ['headdepth', 'basedepth', 'cliff', 'apriltag', 'ratedspeed', 'estop', 'turningwidth', 'clifflowerspeed', 'traversegap', 'narrow', 'accuracylaser', 'accuracyapriltag'].indexOf(tabId) !== -1;
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  var lastSyncAt = 0;
  var currentSyncState = 'loading';

  function formatSyncAge() {
    if (!lastSyncAt) return 'Connecting…';
    var seconds = Math.max(0, Math.floor((Date.now() - lastSyncAt) / 1000));
    if (seconds < 5) return 'Synced just now';
    if (seconds < 60) return 'Synced ' + seconds + 's ago';
    var minutes = Math.floor(seconds / 60);
    if (minutes < 60) return 'Synced ' + minutes + 'm ago';
    return 'Synced ' + Math.floor(minutes / 60) + 'h ago';
  }

  function updateSyncRelativeLabel() {
    var text = document.getElementById('syncText');
    if (text && currentSyncState === 'ready') text.innerText = formatSyncAge();
  }

  function setSyncState(label, state) {
    var dot = document.getElementById('syncDot');
    var text = document.getElementById('syncText');
    currentSyncState = state || 'ready';
    if (currentSyncState === 'ready') {
      lastSyncAt = Date.now();
      window.lastOverviewSyncAt = lastSyncAt;
    }
    if (text) {
      text.innerText = currentSyncState === 'ready' ? formatSyncAge() : label;
      text.title = label || '';
    }
    if (dot) dot.className = 'sync-dot ' + currentSyncState;
  }

  // Module identity lives in Modules_UI.html; shared behavior stays here.
  var DASHBOARD_MODULES = MODULE_UI_REGISTRY;

  function loadAllModulesDashboard() {
    var requestId = ++loadRequestId;
    var pending = DASHBOARD_MODULES.length;
    var results = [];
    var container = document.getElementById('tableContainer');
    var cachedDashboard = localStorage.getItem('iso_dashboard_cache');
    if (cachedDashboard) {
      try {
        renderAllModulesDashboard(JSON.parse(cachedDashboard));
        setSyncState('Refreshing live data…', 'loading');
      } catch (cacheError) {
        container.innerHTML = renderDashboardLoading();
      }
    } else {
      container.innerHTML = renderDashboardLoading();
    }

    DASHBOARD_MODULES.forEach(function(module) {
      var runner = google.script.run.withSuccessHandler(function(data) {
        results.push({ module: module, data: data });
        pending--;
        if (!pending && requestId === loadRequestId) {
          renderAllModulesDashboard(results);
          saveDashboardCache(results);
        }
      }).withFailureHandler(function(error) {
        results.push({ module: module, data: { success: false, error: error.message || String(error) } });
        pending--;
        if (!pending && requestId === loadRequestId) {
          renderAllModulesDashboard(results);
          saveDashboardCache(results);
        }
      });

      if (module.method === 'getModuleData') runner.getModuleData(module.key);
      else runner[module.method]();
    });
  }

  function renderDashboardLoading() {
    return '<div class="dashboard-loading panel-card"><div class="spinner"></div><p>Loading all ISO modules…</p></div>';
  }

  function saveDashboardCache(results) {
    try {
      var compact = results.map(function(item) {
        var data = item.data || {};
        return { module: item.module, data: {
          success: data.success,
          title: data.title,
          sheetName: data.sheetName,
          headers: (data.headers || []).slice(0, 5),
          rows: (data.rows || []).slice(0, 5),
          summary: data.summary || {}
        }};
      });
      localStorage.setItem('iso_dashboard_cache', JSON.stringify(compact));
    } catch (cacheError) { }
  }

  function getDashboardRows(data) {
    if (!data) return [];
    if (data.rows) return data.rows;
    if (data.accuracy && data.tilt) return (data.accuracy.rows || []).concat(data.tilt.rows || []);
    return [];
  }

  function renderAllModulesDashboard(results) {
    var groups = {};
    results.forEach(function(item) {
      if (!groups[item.module.group]) groups[item.module.group] = [];
      groups[item.module.group].push(item);
    });

    var html = '<section class="dashboard-intro"><div><div class="eyebrow">ALL TEST MODULES</div><h1>ISO execution dashboard</h1><p>All test areas are visible here. Expand a module to inspect its latest records.</p></div><button class="btn-ctrl" onclick="loadCurrentTab()">Refresh all</button></section>';
    Object.keys(groups).forEach(function(groupName) {
      html += '<section class="dashboard-group"><div class="dashboard-group-heading"><h2>' + escapeHtml(groupName) + '</h2><span>' + groups[groupName].length + ' modules</span></div><div class="dashboard-module-grid">';
      groups[groupName].forEach(function(item) { html += renderDashboardModule(item); });
      html += '</div></section>';
    });
    document.getElementById('tableContainer').innerHTML = html;
    setSyncState('All modules ready', 'ready');
  }

  function renderDashboardModule(item) {
    var data = item.data || {};
    var rows = getDashboardRows(data);
    var summary = data.summary || {};
    var status = data.success === false ? 'Unavailable' : (rows.length + ' records');
    var table = '';

    if (data.success === false) {
      table = '<div class="dashboard-error">' + escapeHtml(data.error || 'Unable to read this module.') + '</div>';
    } else if (data.headers && rows.length) {
      var headers = data.headers.slice(0, 5);
      table = '<div class="dashboard-table-wrap"><table class="dashboard-table"><thead><tr>' + headers.map(function(h) { return '<th>' + escapeHtml(h) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.slice(0, 5).forEach(function(row) { table += '<tr>' + headers.map(function(_, index) { return '<td>' + escapeHtml(row[index]) + '</td>'; }).join('') + '</tr>'; });
      table += '</tbody></table></div>';
    } else {
      table = '<div class="dashboard-empty">No records available.</div>';
    }

    return '<details class="dashboard-module-card"><summary><span class="dashboard-module-title"><b>' + escapeHtml(item.module.title) + '</b><small>' + escapeHtml(data.sheetName || data.title || item.module.group) + '</small></span><span class="dashboard-module-status">' + escapeHtml(status) + '</span></summary><div class="dashboard-module-body"><div class="dashboard-mini-stats"><span>Pass <b>' + (summary.pass || 0) + '</b></span><span>Fail <b>' + (summary.fail || 0) + '</b></span><span>Review <b>' + (summary.warning || 0) + '</b></span></div>' + table + '<button class="btn-ctrl dashboard-open-button" onclick="switchTab(\'' + item.module.key + '\')">Open full module</button></div></details>';
  }

  function loadCurrentTab(forceRefresh) {
    var container = document.getElementById('tableContainer');
    var requestId = ++loadRequestId;
    setSyncState('Reading Google Sheets', 'loading');

    if (currentTab === 'general') {
      if (typeof getOrCreateGeneralInfoContainer === 'function') container = getOrCreateGeneralInfoContainer();
      var overviewLayout = document.getElementById('overviewLayout');

    var hasCachedTab = false;
    if (cachedTab) {
      try { renderCachedTab(JSON.parse(cachedTab)); hasCachedTab = true; } catch (cacheError) { }
    }

    if (isGenericModule(currentTab)) {
      if (!hasCachedTab) container.innerHTML = renderLoadingSkeleton();
      var moduleEntryPoints = {
        headdepth: 'getHeadDepthData', basedepth: 'getBaseDepthData', cliff: 'getIRCliffData',
        ratedspeed: 'getRatedSpeedData', estop: 'getEStopData', turningwidth: 'getTurningWidthData',
        clifflowerspeed: 'getCliffLowerSpeedData', traversegap: 'getTraverseGapData',
        narrow: 'getNarrowCorridorData', apriltag: 'getAprilTagData',
        accuracylaser: 'getModuleData', accuracyapriltag: 'getModuleData'

    if (!hasCachedTab) container.innerHTML = renderLoadingSkeleton();

    if (currentTab === 'overview') {
      google.script.run.withSuccessHandler(function(r){
        if (requestId !== loadRequestId) return;
        setSyncState('Live data ready','ready');
        saveTabCache('overview', { type: 'overview', data: r });
        renderOverview(r, rawHeadDepthResponse);

        // Load it after the first paint and update only that summary area.
        setTimeout(function() {
          if (requestId !== loadRequestId) return;
          google.script.run.withSuccessHandler(function(headDepth) {

    } else if (currentTab === 'wifi') {
      google.script.run.withSuccessHandler(function(r){ if(requestId===loadRequestId){ setSyncState('Live data ready','ready'); saveTabCache('wifi', { type:'wifi', data:r }); renderTable(r); }}).withFailureHandler(showError).getWifiData();

    }

  function renderCachedTab(cached) {
    if (!cached || !cached.data) return;
    if (cached.type === 'overview') { renderOverview(cached.data, rawHeadDepthResponse); }
    if (cached.type === 'module') { rawModuleResponse = cached.data; renderSmartModule(cached.data); }
    if (cached.type === 'wifi') { rawWifiResponse = cached.data; renderTable(cached.data); }
    if (cached.type === 'lidar') { rawLidarResponse = cached.data; renderSplitLidarTable(cached.data); }
    setSyncState('Cached view · refreshing…', 'loading');
  }

  function saveTabCache(tabId, value) {
    try {
      if (value && value.data && value.type === 'module' && tabId !== 'basedepth') {
        var data = value.data;
        value.data = Object.assign({}, data, { rows: (data.rows || []).slice(0, 20) });

  function renderLoadingSkeleton() {

  function getModulePurpose(moduleKey, fallback) {
    var purposes = {
      lidar: 'To evaluate 360-degree laser range accuracy, distance linearity, and sensor tilt alignment across target distances.',
      cliff: 'To test bottom infrared cliff sensor thresholds, drop-off boundary detection, and anti-fall safety triggers.',
      wifi: 'To evaluate signal attenuation, RSSI stability, and throughput performance across variable indoor distances.',
      basedepth: 'To evaluate obstacle detection capability and distance measurement precision of the lower depth sensor across standard hurdle heights (3cm, 2.5cm, 2cm).',
      headdepth: 'To find out how head depth cam detection works with a flat surface and evaluate detection distance limits.',
      traversegap: 'To assess dynamic mobility, threshold crossing, obstacle clearance, and gap traversal reliability under active drive commands.',
      accuracy: 'To measure statistical variance, positioning repeatability, and sensor error distribution over cyclic multi-run trials.'

    return purposes[moduleKey] || fallback || 'To validate ISO test performance and measurement behavior for this module.';

  function renderSmartModule(response) {
    var container = document.getElementById('tableContainer');
    if (!response || !response.success) {
      setSyncState(response && response.missingSheet ? 'Sheet tab not matched' : 'Connection issue', 'error');
      var available = response && response.availableSheets ? response.availableSheets.join(', ') : '';
      container.innerHTML = '<div class="smart-empty panel-card"><div class="empty-icon">!</div>' +
        '<h3>' + escapeHtml(response && response.title ? response.title : 'Module data') + ' needs a sheet tab</h3>' +
        '<p>' + escapeHtml(response && response.error ? response.error : 'Unable to read this module.') + '</p>' +
        (available ? '<details><summary>Available tabs</summary><p>' + escapeHtml(available) + '</p></details>' : '') + '</div>';
      return;
    }

    // A live Sheets refresh, search update, or language refresh must never
    // replace an in-progress inline record. Keep the newest response and
    // apply it after the technician saves or cancels the draft.
    if (inlineRecordActive && inlineRecordModuleKey === response.key) {
      if (document.querySelector('.inline-add-row')) {
        pendingInlineModuleResponse = response;
        setSyncState('New data ready · finish draft first', 'ready');
        return;
      }
      // Recover from a stale flag if another renderer removed the row.
      inlineRecordActive = false;
      inlineRecordModuleKey = '';
      pendingInlineModuleResponse = null;
    }

    if (response.key === 'traversegap') {
      renderTraverseGap(response);
      return;
    }
    if (response.key === 'cliff') {
      renderIrCliffTable(response);
      return;
    }
    var expandableKeys = ['basedepth', 'ratedspeed', 'estop', 'turningwidth', 'clifflowerspeed', 'narrow', 'apriltag', 'accuracylaser', 'accuracyapriltag'];
    if (expandableKeys.indexOf(response.key) !== -1 && response.roles && response.roles.robot >= 0) {
      renderExpandableIsoModule(response);
      return;
    }

    setSyncState('Synced ' + response.updatedAt, 'ready');
    var summary = response.summary || {};
    var rows = filterRows(response.rows || []);
    // Head Depth sheets often contain a second visual header row for the
    // distance columns. It must not be rendered as an empty robot record.
    if (response.key === 'headdepth') {
      rows = rows.filter(function(item) {
        var row = Array.isArray(item) ? item : (item && Array.isArray(item.row) ? item.row : []);
        var text = row.map(function(value) { return String(value || '').trim().toLowerCase(); }).join(' ');
        var robotValue = String(row[0] || '').trim();
        var helperDistanceRow = /0\.3\s*m/.test(text) && /0\.5\s*m/.test(text) && /1\.0\s*m/.test(text);
        var helperDescriptionRow = /is starting to shrink|becomes totally undetected/.test(text);
        return !(helperDistanceRow || (helperDescriptionRow && !robotValue));
      });
      renderHeadDepthSmartTable(response, rows);
      return;
    }
    var compactFlatModule = response.key === 'cliff';
    var html = '<div class="panel-card smart-table-card"><div class="module-unified-hero"><div class="hero-left"><span class="eyebrow">DATA EXPLORER</span><h1 class="hero-title">' + escapeHtml(response.title) + '</h1><p class="hero-purpose"><strong>PURPOSE</strong><span>' + escapeHtml(getModulePurpose(response.key, response.purpose)) + '</span></p></div><div class="hero-actions"><span class="hero-badge-count">' + rows.length + (searchQuery ? ' matched' : ' rows') + '</span></div></div>';

    if (!response.headers.length || !rows.length) {
      html += '<div class="smart-empty compact"><h3>' + (searchQuery ? 'No matching records' : 'No data rows yet') + '</h3><p>' + (searchQuery ? 'Try a different Robot ID, tester, status, or value.' : 'The sheet is connected and ready for new records.') + '</p></div>';
    } else {
      html += '<div class="table-scroller"><table class="smart-table' + (compactFlatModule ? ' module-table-cliff' : '') + '"><thead>';
      html += renderSmartTableHeader(response);
      html += '</thead><tbody id="genericModuleTableBody">';
      rows.forEach(function(item) {
        var sourceRow = (response.headerRow || 1) + 1 + item.originalIndex;
        html += '<tr>' + buildSmartRow(item.row, response.roles, response.headers, response.key, sourceRow, response.sheetName) + '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    container.innerHTML = html;
  }

  function findHeaderIndex(headers, patterns, fallback) {
    for (var i = 0; i < headers.length; i++) {
      var header = String(headers[i] || '').toLowerCase();
      for (var p = 0; p < patterns.length; p++) {
        if (patterns[p].test(header)) return i;
      }
    }
    return fallback === undefined ? -1 : fallback;
  }

  function renderIrCliffTable(response) {
    var container = document.getElementById('tableContainer');
    var headers = response.headers || [];
    var rows = filterRows(response.rows || []);
    var robotColumn = response.roles && response.roles.robot >= 0 ? response.roles.robot : 0;
    var statusColumns = response.roles && response.roles.status ? response.roles.status : [];
    var selectedColumns = [];
    var frontColumns = [], rearColumns = [];
    headers.forEach(function(header, column) {
      if (column === robotColumn) return;
      if (/front/i.test(String(header))) frontColumns.push(column);
      if (/rear|back/i.test(String(header))) rearColumns.push(column);
      if (statusColumns.indexOf(column) !== -1 || /front|rear|distance|height|cliff|result|status|value|sensor|detect|pass|fail/i.test(String(header))) selectedColumns.push(column);
    });
    if (!selectedColumns.length) selectedColumns = headers.map(function(_, index) { return index; }).filter(function(index) { return index !== robotColumn; }).slice(0, 6);
    selectedColumns = selectedColumns.slice(0, 7);
    var groups = { front: [], rear: [], other: [] };
    rows.forEach(function(item) {
      var text = (item.row || []).join(' ').toLowerCase();
      var hasFrontData = frontColumns.some(function(column) { return String(item.row[column] || '').trim() !== ''; });
      var hasRearData = rearColumns.some(function(column) { return String(item.row[column] || '').trim() !== ''; });
      if (/front/.test(text) || (hasFrontData && !hasRearData)) groups.front.push(item.row);
      else if (/rear|back/.test(text) || hasRearData) groups.rear.push(item.row);
      else groups.other.push(item.row);
    });
    var groupLabels = [{ key:'front', label:'Front IR', description:'Front cliff sensor tests' }, { key:'rear', label:'Rear IR', description:'Rear cliff sensor tests' }, { key:'other', label:'Other IR', description:'Rows without a Front/Rear label' }];
    var html = '<div class="module-unified-hero"><div class="hero-left"><span class="eyebrow">DATA EXPLORER</span><h1 class="hero-title">IR Cliff</h1><p class="hero-purpose"><strong>PURPOSE</strong><span>' + escapeHtml(getModulePurpose('cliff')) + '</span></p></div><div class="hero-actions"><span class="hero-badge-count">' + rows.length + ' rows</span></div></div>';
    html += '<div class="ir-cliff-table-card"><div class="ir-cliff-table-note"><strong>' + rows.length + ' records</strong><span>Open a section to inspect its tests.</span></div>';
    groupLabels.forEach(function(group) {
      var groupRows = groups[group.key];
      if (!groupRows.length) return;
      html += '<details class="ir-cliff-section" open><summary><span class="ir-cliff-toggle">+</span><span><strong>' + group.label + '</strong><small>' + group.description + '</small></span><em>' + groupRows.length + ' rows</em></summary><div class="ir-cliff-scroll"><table class="smart-table module-table-cliff"><thead><tr><th>Robot ID</th>';
      selectedColumns.forEach(function(column) { html += '<th title="' + escapeHtml(headers[column]) + '">' + escapeHtml(headers[column]) + '</th>'; });
      html += '<th class="module-action-header">Action</th>';
      html += '</tr></thead><tbody>';
      groupRows.forEach(function(row) {
        html += '<tr><td class="identity-cell">' + escapeHtml(row[robotColumn] || '—') + '</td>';
        selectedColumns.forEach(function(column) {
          var value = String(row[column] || '').trim();
          var cell = !value ? '<span class="empty-cell">—</span>' : ((statusColumns.indexOf(column) !== -1 || /^(pass|fail|normal|ok|ng|done)$/i.test(value)) ? renderStatusBadge(value) : '<span aria-label="' + escapeHtml(value) + '">' + escapeHtml(value) + '</span>');
          html += '<td>' + cell + '</td>';
        });
        var sourceRow = (response.headerRow || 1) + 1 + response.rows.indexOf(row);
        html += '<td class="module-action-cell">' + renderGenericActionDropdown('cliff', sourceRow) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div></details>';
    });
    container.innerHTML = html + '</div>';
    setSyncState('Synced ' + response.updatedAt, 'ready');
  }

  function getTraverseGroups(response) {
    var robotCol = response.roles && response.roles.robot >= 0 ? response.roles.robot : 0;
    var groups = [];
    var active = null;

    (response.rows || []).forEach(function(row, rowIndex) {
      var robotId = String(row[robotCol] || '').trim();
      if (robotId) {
        active = { id: robotId, firstRow: row, rows: [], sourceIndex: rowIndex };
        groups.push(active);
      }
      if (active) active.rows.push(row);
    });
    return groups;
  }

  function getTraverseGroupState(group, statusColumns) {
    var pass = 0, fail = 0, warning = 0;
    group.rows.forEach(function(row) {
      statusColumns.forEach(function(col) {
        var value = String(row[col] || '').toLowerCase().trim();
        if (!value) return;
        if (/\bfail\b|\bng\b|not acceptable|reject|bad/.test(value)) fail++;
        else if (/\bpass\b|\bok\b|acceptable|normal|done/.test(value)) pass++;
        else if (/warn|pending|wait|progress|partial|retest/.test(value)) warning++;
      });
    });
    return { pass: pass, fail: fail, warning: warning, key: fail ? 'fail' : (warning ? 'warning' : (pass ? 'pass' : 'pending')) };
  }

  function setTraverseResultFilter(filterKey) {
    traverseResultFilter = filterKey;
    if (rawModuleResponse) renderTraverseGap(rawModuleResponse);
  }

  function renderTraverseGap(response) {
    var container = document.getElementById('tableContainer');
    setSyncState('Synced ' + response.updatedAt, 'ready');

    var headers = response.headers || [];
    var groups = getTraverseGroups(response);
    var robotCol = response.roles.robot >= 0 ? response.roles.robot : 0;
    var testerCol = response.roles.tester;
    var dateCol = response.roles.date;
    var swCol = findHeaderIndex(headers, [/^sw\b/, /software/], -1);
    var appCol = findHeaderIndex(headers, [/app.*version/, /application.*version/], -1);
    var tempCol = findHeaderIndex(headers, [/temp/], -1);
    var humidityCol = findHeaderIndex(headers, [/humidity/], -1);
    var lightCol = findHeaderIndex(headers, [/illumination/, /lux/, /light/], -1);
    var runCol = findHeaderIndex(headers, [/traverse.*test/, /gap.*test/, /slope.*test/, /^run\b/], Math.max(robotCol + 1, headers.length - 6));
    var statusCols = response.roles.status || [];
    var nonTemplate = groups.filter(function(group) { return group.id.toLowerCase().indexOf('template') === -1; });
    var templateGroups = groups.filter(function(group) { return group.id.toLowerCase().indexOf('template') !== -1; });

    var totalPass = 0, totalFail = 0, totalWarning = 0, totalRuns = 0;
    nonTemplate.forEach(function(group) {
      group.state = getTraverseGroupState(group, statusCols);
      totalPass += group.state.pass;
      totalFail += group.state.fail;
      totalWarning += group.state.warning;
      totalRuns += group.rows.filter(function(row) { return row.slice(runCol).join('').trim() !== ''; }).length;
    });
    var completed = totalPass + totalFail + totalWarning;
    var passRate = completed ? Math.round(totalPass / completed * 100) : 0;
    var attentionRobots = nonTemplate.filter(function(group) { return group.state.key === 'fail' || group.state.key === 'warning'; }).length;

    var visibleGroups = nonTemplate.filter(function(group) {
      var matchesSearch = !searchQuery || group.rows.some(function(row) { return row.join(' ').toLowerCase().indexOf(searchQuery) !== -1; });
      var matchesFilter = traverseResultFilter === 'all' ||
        (traverseResultFilter === 'attention' && (group.state.key === 'fail' || group.state.key === 'warning')) ||
        group.state.key === traverseResultFilter;
      return matchesSearch && matchesFilter;
    });

    var html = '<section class="module-hero traverse-hero"><div><div class="eyebrow">TEST RECORDS</div><h1>Traverse Gap</h1>' +
      '<p>Robot-level inspection view from <strong>' + escapeHtml(response.sheetName) + '</strong></p></div>' +
      '<div class="module-health"><span class="health-pulse"></span> Live workbook</div></section>';

    html += '<div class="traverse-toolbar"><div class="result-filter" role="group" aria-label="Filter traverse results">' +

      traverseFilterButton('attention', 'Needs attention', attentionRobots) +
      '</div><span class="traverse-view-count">Showing ' + visibleGroups.length + ' of ' + nonTemplate.length + ' robots</span></div>';

    if (!visibleGroups.length) {
      html += '<div class="panel-card smart-empty compact"><div class="empty-icon">0</div><h3>No robots match this view</h3><p>Change the result filter or search for another Robot ID, tester, or run.</p></div>';
    } else {
      html += '<div class="traverse-groups">';
      visibleGroups.forEach(function(group, groupIndex) {
        html += renderTraverseGroup(group, groupIndex, headers, {
          robot: robotCol, tester: testerCol, date: dateCol, sw: swCol, app: appCol,
          temp: tempCol, humidity: humidityCol, light: lightCol, run: runCol, status: statusCols
        }, !!searchQuery);
      });
      html += '</div>';
    }

    if (templateGroups.length) {
      html += '<details class="test-plan-panel"><summary><span>Reference test plan</span><small>' + templateGroups[0].rows.length + ' configured runs</small></summary>' +
        renderTraverseRunTable(templateGroups[0], headers, runCol, statusCols) + '</details>';
    }
    container.innerHTML = html;
  }

  function traverseFilterButton(key, label, count) {
    return '<button class="result-filter-btn ' + (traverseResultFilter === key ? 'active' : '') + '" onclick="setTraverseResultFilter(\'' + key + '\')">' +
      escapeHtml(label) + '<span>' + count + '</span></button>';

  function valueAt(row, index) {

  function renderTraverseGroup(group, groupIndex, headers, columns, forceOpen) {

  function traverseMeta(label, value) {

  function renderTraverseRunTable(group, headers, runCol, statusColumns) {

  function groupModuleRowsByRobot(response) {
    var robotCol = response.roles && response.roles.robot >= 0 ? response.roles.robot : 0;
    var groups = [];
    var groupById = {};

  function renderBaseDepthObstacleTable(group, response) {
    var headers = response.headers || [];
    var statusColumns = response.roles.status || [];
    var identityColumns = [response.roles.robot, response.roles.tester, response.roles.date];
    identityColumns.push(findHeaderIndex(headers, [/^sw\b/, /software.*version/], -1));
    var obstacleColumn = findHeaderIndex(headers, [/obstacle/, /object.*type/, /target.*type/, /brick/, /object.*size/, /obstacle.*size/, /^setup$/], -1);
    var runColumn = findHeaderIndex(headers, [/^run\b/, /^trial\b/, /sequence/, /^#$/], -1);

    if (obstacleColumn < 0) {
      for (var candidate = 0; candidate < headers.length; candidate++) {
        if (identityColumns.indexOf(candidate) !== -1 || statusColumns.indexOf(candidate) !== -1) continue;
        var sizeHits = group.rows.filter(function(row) { return /^\s*\d+(?:\.\d+)?\s*(?:cm|mm|m)\s*$/i.test(String(row[candidate] || '')); }).length;
        if (sizeHits) { obstacleColumn = candidate; break; }
      }
    }

    var tableColumns = [];
    headers.forEach(function(header, column) {
      if (identityColumns.indexOf(column) !== -1 || column === obstacleColumn) return;
      var hasValue = group.rows.some(function(row) { return String(row[column] || '').trim() !== ''; });
      if (hasValue) tableColumns.push(column);
    });
    tableColumns.sort(function(a, b) {
      function priority(column) {
        if (column === runColumn) return 0;
        if (statusColumns.indexOf(column) !== -1) return 1;
        if (/distance|depth|height|error|average|deviation/i.test(headers[column])) return 2;
        if (/link|evidence|note|remark/i.test(headers[column])) return 4;
        return 3;
      }
      return priority(a) - priority(b) || a - b;
    });
    tableColumns = tableColumns.slice(0, 8);

    var obstacleGroups = [];
    var byName = {};
    var activeName = 'All measurements';
    group.rows.forEach(function(row) {
      var suppliedName = obstacleColumn >= 0 ? String(row[obstacleColumn] || '').trim() : '';
      if (suppliedName) activeName = suppliedName;
      if (!byName[activeName]) {
        byName[activeName] = { name: activeName, rows: [] };
        obstacleGroups.push(byName[activeName]);
      }
      byName[activeName].rows.push(row);
    });

    var html = '<div class="base-depth-table-intro"><div><strong>Obstacle measurement table</strong><span>Click <b>+</b> on an obstacle type to see its recorded measurements.</span></div>' +
      '<span class="row-count-chip">' + obstacleGroups.length + ' obstacle types</span></div><div class="base-depth-obstacle-list">';

    obstacleGroups.forEach(function(obstacle, obstacleIndex) {
      var hasFail = obstacle.rows.some(function(row) { return statusColumns.some(function(column) { return /fail|\bng\b/i.test(String(row[column] || '')); }); });
      var hasPass = obstacle.rows.some(function(row) { return statusColumns.some(function(column) { return /pass|done|normal|\bok\b/i.test(String(row[column] || '')); }); });
      var state = hasFail ? 'fail' : (hasPass ? 'pass' : 'pending');
      var stateLabel = hasFail ? 'Needs attention' : (hasPass ? 'Pass' : 'Not evaluated');
      html += '<details class="base-depth-obstacle state-' + state + '"' + (searchQuery ? ' open' : '') + '><summary>' +
        '<span class="obstacle-toggle" aria-hidden="true">+</span><span class="obstacle-name">' + escapeHtml(obstacle.name) + '</span>' +
        '<span class="obstacle-runs">' + obstacle.rows.length + ' measurements</span><span class="group-state ' + state + '">' + stateLabel + '</span></summary>' +
        '<div class="base-depth-table-wrap"><table class="base-depth-compact-table"><thead><tr><th>#</th>';
      tableColumns.forEach(function(column) {
        var label = String(headers[column] || '').trim();
        if (!label || /^column\s*\d+$/i.test(label)) label = 'Measurement';
        html += '<th title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</th>';
      });
      html += '</tr></thead><tbody>';
      obstacle.rows.forEach(function(row, rowIndex) {
      var sourceRow = (response.headerRow || 1) + 1 + (group.sourceIndex || 0) + rowIndex;
      html += '<tr><td>' + (rowIndex + 1) + '</td>';
        tableColumns.forEach(function(column) {
          var value = String(row[column] || '').trim();
          var cell = '<span class="empty-cell">—</span>';
          if (/^https?:\/\//i.test(value)) cell = '<a class="data-link" href="' + escapeHtml(value) + '" target="_blank" rel="noopener noreferrer">Open ↗</a>';
          else if (statusColumns.indexOf(column) !== -1 || /^(pass|fail|done|pending|normal|ok|ng)$/i.test(value)) cell = renderStatusBadge(value);
          else if (value) cell = '<span title="' + escapeHtml(value) + '">' + escapeHtml(value) + '</span>';
          html += '<td>' + cell + '</td>';
        });
      html += '<td class="base-depth-edit-cell"><button type="button" class="base-depth-edit-button" onclick="editBaseDepthRow(event, ' + sourceRow + ')">Edit</button><button type="button" class="table-delete-button" onclick="deleteGenericRow(event, ' + sourceRow + ', \'basedepth\')">Delete</button></td></tr>';
      });
      html = html.replace('</tr></thead>', '<th>Action</th></tr></thead>');
      html += '</tbody></table></div></details>';
    });
    return html + '</div>';
  }

  function getDisplayImageUrl(value) {

    var driveMatch = url.match(/(?:\/d\/|[?&]id=)([-\w]{20,})/i);
    if (/docs\.google\.com\/sheets-images-rt/i.test(url) && typeof HEAD_DEPTH_TEST_IMAGE_URL !== 'undefined') {
      return HEAD_DEPTH_TEST_IMAGE_URL;
    }
    if (driveMatch) {
      return 'https://drive.google.com/thumbnail?id=' + driveMatch[1] + '&sz=w800';

    return url;
  }

  function isImageCell(value, header, moduleKey) {
    var text = String(value || '').trim();

    var likelyHeadDepthImage = moduleKey === 'headdepth' || /column\s*(?:9|10)|image|photo|picture|screenshot|evidence|capture|camera/i.test(label);
    if (!likelyHeadDepthImage) return false;
    if (!/link$/i.test(label)) return true;
    return /image|photo|picture|screenshot|evidence|capture|camera|robot/i.test(label) ||
      /\.(png|jpe?g|gif|webp|bmp)(?:[?#].*)?$/i.test(text) ||
      /drive\.google\.com|googleusercontent\.com/i.test(text);

  function handleSheetImageError(image) {
    var driveId = image.src.match(/(?:[?&]id=|\/d\/)([-\w]{20,})/i);
    var retry = Number(image.dataset.retry || 0);
    if (driveId && retry < 2 && !image.dataset.sheetName) {
      image.dataset.retry = String(retry + 1);
      if (retry === 0) {
        image.src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(driveId[1]) + '&sz=w1000';
      } else {
        image.src = 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(driveId[1]) + '=w1000';
      }
      return;
    }
    if (!image.dataset.proxyAttempted && image.dataset.sheetName && image.dataset.sheetRow && image.dataset.sheetColumn) {
      image.dataset.proxyAttempted = '1';
      var button = image.parentNode;
      var label = button && button.querySelector('.sheet-image-zoom');
      if (label) label.innerText = 'Loading';
      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success && result.dataUrl) {
          image.style.display = 'block';
          image.src = result.dataUrl;
          if (button) button.classList.remove('image-unavailable');
          if (label) label.innerText = 'Preview';
          return;
        }
        markSheetImageUnavailable(image);
      }).withFailureHandler(function() { markSheetImageUnavailable(image); }).getIsoImageData({
        sheetName: image.dataset.sheetName,
        row: Number(image.dataset.sheetRow),
        column: Number(image.dataset.sheetColumn)
      });
      return;
    }
    markSheetImageUnavailable(image);
  }

  function markSheetImageUnavailable(image) {

    }
  }

  function openSheetImageButtonPreview(button) {

      requestSheetImageProxy(image, function() {
        if (image.src && image.naturalWidth) {
          openSheetImagePreview(encodeURIComponent(image.src), encodeURIComponent(button.dataset.imageTitle || 'Head depth image'));
        } else if (image.dataset.originalUrl) {
          openSheetImagePreview(encodeURIComponent(image.dataset.originalUrl), encodeURIComponent(button.dataset.imageTitle || 'Head depth image'));
        }
      });
      return;
    }
    openSheetImagePreview(encodeURIComponent(image.src), encodeURIComponent(button.dataset.imageTitle || 'Head depth image'));
  }

  function requestSheetImageProxy(image, onComplete) {
    if (!image || !image.dataset.sheetName) return;
    if (image.dataset.proxyAttempted) {
      if (onComplete) onComplete();
      return;
    }
    if (/^data:image\//i.test(image.getAttribute('src') || '')) {
      if (onComplete) onComplete();
      return;
    }
    image.dataset.proxyAttempted = '1';
    var button = image.parentNode;
    var label = button && button.querySelector('.sheet-image-zoom');
    if (label) label.innerText = '…';
    google.script.run.withSuccessHandler(function(result) {
      if (result && result.success && result.dataUrl) {
        image.style.display = 'block';
        image.src = result.dataUrl;
        if (button) button.classList.remove('image-unavailable');
        if (label) label.innerText = '↗';
        if (onComplete) onComplete();
      } else {
        markSheetImageUnavailable(image);
        if (onComplete) onComplete();
      }
    }).withFailureHandler(function() { markSheetImageUnavailable(image); if (onComplete) onComplete(); }).getIsoImageData({
      sheetName: image.dataset.sheetName,
      row: Number(image.dataset.sheetRow),
      column: Number(image.dataset.sheetColumn)
    });
  }

  function deleteGenericRow(event, sheetRow, moduleKey) {

      var previousResponse = cloneStaticIsoResponse(rawModuleResponse);
      var dataIndex = Number(sheetRow) - Number(rawModuleResponse.headerRow || 1) - 1;
      if (dataIndex < 0 || dataIndex >= rawModuleResponse.rows.length) {
        handleFail('Delete failed: record index is invalid.');
        return;
      }
      rawModuleResponse.rows.splice(dataIndex, 1);
      renderSmartModule(rawModuleResponse);

      var rollback = function(error) {

  var LIDAR_ISO_TOLERANCE_M = 0.05;

  function parseLidarNumber(value) {
    var number = parseFloat(String(value === null || value === undefined ? '' : value).replace(',', '.'));
    return isFinite(number) ? number : null;
  }

  function getLidarRunState(run, target) {
    if (!run) return 'empty';
    var status = String(run.passFail || '').toLowerCase();
    var measured = parseLidarNumber(run.distance);
    var error = measured === null ? null : Math.abs(measured - target);
    if (/fail|ng|reject|outside/.test(status)) return 'fail';
    if (error === null) return 'empty';
    if (error > LIDAR_ISO_TOLERANCE_M * 2) return 'fail';
    if (error > LIDAR_ISO_TOLERANCE_M) return 'warn';
    return 'pass';
  }

  function renderLidarAccuracyMeasurement(run, target) {
    if (!run || parseLidarNumber(run.distance) === null) return '<span class="lidar-empty">—</span>';
    var measured = parseLidarNumber(run.distance);
    var delta = measured - target;
    var state = getLidarRunState(run, target);
    var deltaText = (delta >= 0 ? '+' : '') + delta.toFixed(2) + 'm';
    return '<div class="lidar-measurement state-' + state + '" title="Target ' + target.toFixed(2) + 'm · Delta ' + escapeHtml(deltaText) + ' · ' + escapeHtml(run.passFail || state) + '"><strong>' + measured.toFixed(2) + 'm</strong></div>';
  }

  function renderLidarReleaseCell(swVersion, date) {
    return '<div class="lidar-release-cell"><strong>' + escapeHtml(swVersion || 'Not recorded') + '</strong><small>' + escapeHtml(date || 'Date unavailable') + '</small></div>';
  }

  function renderLidarTiltStatus(value) {
    var text = String(value || '').trim();
    var lower = text.toLowerCase();
    var label = text || 'Not recorded';
    var state = 'neutral';
    if (/tilt\s*up/.test(lower)) { label = '▲ Tilt Up'; state = 'warn'; }
    else if (/tilt\s*down/.test(lower)) { label = '▼ Tilt Down'; state = 'warn'; }
    else if (/normal|acceptable|pass|ok/.test(lower)) { label = '✓ Normal'; state = 'pass'; }
    else if (/fail|outside|reject|bad|ng/.test(lower)) { label = '! Review'; state = 'fail'; }
    return '<span class="lidar-tilt-chip ' + state + '" title="' + escapeHtml(text) + '">' + label + '</span>';
  }

  function formatLidarAngle(value) {
    var number = parseLidarNumber(value);
    if (number === null) return '—';
    return number.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1') + '°';
  }

  function renderLidarAngleRange(fromValue, toValue) {
    return '<span class="lidar-angle-range">' + formatLidarAngle(fromValue) + ' – ' + formatLidarAngle(toValue) + '</span>';
  }

  function renderLidarUnitValue(value, unit) {
    var number = parseLidarNumber(value);
    return number === null ? '<span class="lidar-empty">—</span>' : escapeHtml(String(value)) + '<small class="lidar-unit"> ' + unit + '</small>';
  }

  function renderLidarEvidenceCell(value) {
    var text = String(value || '').trim();
    if (!text || text === '-') return '<span class="lidar-empty">—</span>';
    if (/^https?:\/\//i.test(text)) return '<a class="data-link" href="' + escapeHtml(text) + '" target="_blank" rel="noopener noreferrer">Open ↗</a>';
    return '<span title="' + escapeHtml(text) + '">' + escapeHtml(text) + '</span>';
  }

  // Tilt data is stored in the same LiDAR record block as the three accuracy
  // runs. Render it as an extension of the matching accuracy row.
  function renderLidarTiltExtension(row) {
    if (!row) {
      return '<td><span class="lidar-empty">—</span></td>' +
        '<td><span class="lidar-empty">—</span></td>' +
        '<td><span class="lidar-empty">—</span></td>' +
        '<td><span class="lidar-empty">—</span></td>' +
        '<td><span class="lidar-empty">—</span></td>' +
        '<td><span class="lidar-empty">—</span></td>' +
        '<td><span class="lidar-empty">—</span></td>';
    }
    return '<td>' + escapeHtml(row[4] || '—') + '</td>' +
      '<td class="lidar-mono">' + renderLidarUnitValue(row[5], 'm') + '</td>' +
      '<td>' + renderLidarUnitValue(row[6], 'cm') + '</td>' +
      '<td>' + renderLidarUnitValue(row[7], 'cm') + '</td>' +
      '<td>' + renderLidarTiltStatus(row[8]) + '</td>' +
      '<td>' + renderLidarAngleRange(row[9], row[10]) + '</td>' +
      '<td>' + renderLidarEvidenceCell(row[11]) + '</td>';
  }

  function getLidarInspectionSummary(accuracyGroups, rawTiltRows) {
    var units = {};
    var maxError = null;
    var pass = 0;
    var total = 0;
    (accuracyGroups || []).forEach(function(item) {
      if (item.robotId) units[item.robotId] = true;
      [[item.runA,5],[item.runB,10],[item.runC,15]].forEach(function(pair) {
        var measured = pair[0] && parseLidarNumber(pair[0].distance);
        if (measured === null || measured === false) return;
        var error = Math.abs(measured - pair[1]);
        maxError = maxError === null ? error : Math.max(maxError, error);
        total++;
        if (getLidarRunState(pair[0], pair[1]) === 'pass') pass++;
      });
    });
    (rawTiltRows || []).forEach(function(row) { if (row && row[0]) units[String(row[0]).trim()] = true; });
    return { totalUnits:Object.keys(units).length, maxError:maxError, passRate:total ? pass / total * 100 : null, sampleCount:total };
  }

  function renderLidarKpiStrip(summary) {
    return '<section class="lidar-internal-kpi-strip" aria-label="LiDAR inspection summary"><article class="kpi-mini-card"><span>Total Units</span><strong>' + summary.totalUnits + '</strong><small>Registered in this module</small></article><article class="kpi-mini-card"><span>Max Range Error</span><strong>' + (summary.maxError === null ? '—' : summary.maxError.toFixed(2) + ' m') + '</strong><small>Across 5 m, 10 m and 15 m</small></article><article class="kpi-mini-card"><span>Calibration Pass Rate</span><strong class="' + (summary.passRate === null ? 'is-empty' : 'is-pass') + '">' + (summary.passRate === null ? '—' : summary.passRate.toFixed(1) + '%') + '</strong><small>' + summary.sampleCount + ' range samples</small></article></section>';
  }

  function groupLidarAccuracyPivoted(rows) {
    var groups = [];
    var currentGroup = null;
    rows.forEach(function(row, idx) {
      if (!row || row.join('').trim() === '') return;
      var robotId = row[0] ? row[0].trim() : '';
      if (robotId !== '') {
        currentGroup = { startRowIndex: idx, robotId: robotId, date: row[1] || '-', swVer: row[2] || '-', tester: row[3] || '-', runA: null, runB: null, runC: null };
        groups.push(currentGroup);
      }
      if (currentGroup) {
        var opt = (row[4] || '').toUpperCase();
        var runData = { distance: row[5] || '-', passFail: row[9] || '-' };
        if (opt.indexOf('A') !== -1) currentGroup.runA = runData;
        else if (opt.indexOf('B') !== -1) currentGroup.runB = runData;
        else if (opt.indexOf('C') !== -1) currentGroup.runC = runData;
      }
    });
    return groups;
  }

  function filterRows(rows) {
    if (!rows) return [];
    var result = [];
    rows.forEach(function(row, idx) {
      if (!row || row.join('').trim() === '') return;
      if (searchQuery === '' || row.join(' ').toLowerCase().indexOf(searchQuery) !== -1) {
        result.push({ row: row, originalIndex: idx });
      }
    });
    return result;
  }

  function renderStatusBadge(text) {
    var cellText = (text !== null && text !== undefined) ? text.toString().trim() : '';
    var lowerText = cellText.toLowerCase();
    var safeText = escapeHtml(cellText || '-');

    if (lowerText === 'pass' || lowerText === 'acceptable' || lowerText === 'normal' || lowerText === 'ok' || lowerText === 'done') {
      return '<span class="status-chip pass" aria-label="' + safeText + '">' + safeText + '</span>';
    } else if (lowerText === 'fail' || lowerText === 'bad' || lowerText === 'ng') {
      return '<span class="status-chip fail" aria-label="' + safeText + '">' + safeText + '</span>';
    } else if (lowerText.indexOf('tilt up') !== -1 || lowerText.indexOf('progress') !== -1 || lowerText.indexOf('warn') !== -1 || lowerText.indexOf('pending') !== -1 || lowerText.indexOf('wait') !== -1) {
      return '<span class="status-chip warn" aria-label="' + safeText + '">' + safeText + '</span>';
    }
    return '<span class="status-chip neutral" aria-label="' + safeText + '">' + safeText + '</span>';
  }

  function buildRowCells(row, startIdx) {
    var html = '';
    for(var i = startIdx; i < row.length; i++) {
      var cellText = (row[i] !== null && row[i] !== undefined) ? row[i].toString().trim() : '';
      var lowerText = cellText.toLowerCase();

      if (lowerText.indexOf('http://') === 0 || lowerText.indexOf('https://') === 0) {
        html += '<td><a href="' + cellText + '" target="_blank" style="color:#2563eb; text-decoration:none; font-weight:600;">Link &#8599;</a></td>';
      } else if (lowerText === 'pass' || lowerText === 'acceptable' || lowerText === 'normal') {
        html += '<td><span class="status-chip pass">' + cellText + '</span></td>';
      } else if (lowerText === 'fail' || lowerText === 'bad') {
        html += '<td><span class="status-chip fail">' + cellText + '</span></td>';
      } else if (lowerText.indexOf('tilt up') !== -1 || lowerText.indexOf('warn') !== -1) {
        html += '<td><span class="status-chip warn">' + cellText + '</span></td>';
      } else if (cellText === '' || cellText === '-') {
        html += '<td style="color:var(--text-muted);">-</td>';
      } else {
            html += '<td ' + (i===startIdx ? 'style="font-weight:700; color:var(--text-primary);"' : '') + ' aria-label="' + escapeHtml(cellText) + '">' + escapeHtml(cellText) + '</td>';
      }
    }
    return html;
  }

  var activeLidarInlineEdit = null;

  function cancelLidarInlineEdit() {
    if (!activeLidarInlineEdit) return;
    var row = activeLidarInlineEdit.row;
    if (row && row.isConnected) {
      row.innerHTML = activeLidarInlineEdit.html;
      row.classList.remove('lidar-inline-edit-row');
    }
    activeLidarInlineEdit = null;
  }

  function startLidarInlineEdit(type, index) {
    var tableRow = document.querySelector('.lidar-inspection-table tr[data-source-index="' + index + '"]');
    if (!tableRow) tableRow = document.querySelector('.lidar-inspection-table tr[data-robot-id]');
    if (!tableRow) return;
    cancelLidarInlineEdit();
    var staticRowSnapshot = tableRow.cloneNode(true);
    staticRowSnapshot.querySelectorAll('.dropdown-menu').forEach(function(menu) {
      menu.classList.remove('show', 'dropup');
      menu.removeAttribute('style');
    });
    activeLidarInlineEdit = { row: tableRow, html: staticRowSnapshot.innerHTML };
    tableRow.classList.add('lidar-inline-edit-row');

    if (type === 'lidar_acc') {
      var r2 = rawLidarResponse.accuracy.rows[index + 1] || [], r3 = rawLidarResponse.accuracy.rows[index + 2] || [];
      var tilt = null;
      if (activeLidarSubTab === 'tilt' && rawLidarResponse.tilt && rawLidarResponse.tilt.rows) {
        for (var ti = 0; ti < rawLidarResponse.tilt.rows.length; ti++) {
          var tr = rawLidarResponse.tilt.rows[ti] || [];
          if (String(tr[0] || '').trim().toUpperCase() === String(data[0] || '').trim().toUpperCase() && String(tr[1] || '').trim().replace(/\//g, '-') === String(data[1] || '').trim().replace(/\//g, '-')) { tilt = { row: tr, index: ti }; break; }
        }
      }
      var tv = tilt ? tilt.row : [];
      var tiltCells = activeLidarSubTab === 'tilt' ?
        '<td>' + input('li_bricks', tv[4], 'number') + '</td><td>' + input('li_detected', tv[5], 'number') + '</td><td>' + input('li_height_from', tv[6], 'number', true) + '</td><td>' + input('li_height_to', tv[7], 'number', true) + '</td><td>' + input('li_tilt_status', tv[8], 'text', true) + '</td><td>' + lidarAngleRangeSelect(tv[9], tv[10]) + '</td><td>' + input('li_note', tv[11]) + '</td>' : '';
      tableRow.innerHTML = '<td>' + input('li_robot', data[0]) + '</td><td>' + input('li_date', data[1], 'date') + '<br>' + input('li_sw', data[2]) + '</td><td>' + input('li_tester', data[3]) + '</td><td>' + input('li_d5', data[5], 'number') + '</td><td>' + input('li_d10', r2[5], 'number') + '</td><td>' + input('li_d15', r3[5], 'number') + '</td>' + tiltCells + '<td class="inline-edit-actions-cell"><div class="inline-row-actions"><button type="button" class="btn-action" onclick="saveLidarInlineEdit(event,\'lidar_acc\',' + index + ',' + (tilt ? tilt.index : -1) + ')">Save</button><button type="button" class="btn-ctrl" onclick="cancelLidarInlineEdit()">Cancel</button></div></td>';
      if (activeLidarSubTab === 'tilt') {
        var brickInput = document.getElementById('li_bricks');
        if (brickInput) brickInput.addEventListener('input', updateLidarInlineTiltFields);
        updateLidarInlineTiltFields();
      }
    } else {
      tableRow.innerHTML = '<td>' + input('li_robot', data[0]) + '</td><td>' + input('li_date', data[1], 'date') + '<br>' + input('li_sw', data[2]) + '</td><td>' + input('li_tester', data[3]) + '</td><td>' + input('li_bricks', data[4], 'number') + '</td><td>' + input('li_detected', data[5], 'number') + '</td><td colspan="5" class="inline-edit-actions-cell"><div class="inline-row-actions">' + input('li_note', data[11]) + '<button type="button" class="btn-action" onclick="saveLidarInlineEdit(event,\'lidar_tilt\',' + index + ')">Save</button><button type="button" class="btn-ctrl" onclick="cancelLidarInlineEdit()">Cancel</button></div></td>';
    }
  }

  var LIDAR_TILT_PROFILES = Array.from({ length: 9 }, function(_, bricks) {
    return {
      bricks: bricks,
      heightFrom: (bricks - 1) * 10,
      heightTo: bricks * 10,
      angleFrom: ((bricks - 4) * 0.38).toFixed(2),
      angleTo: ((bricks - 3) * 0.38).toFixed(2),
      status: bricks < 4 ? 'Tilt Down, Acceptable' : (bricks === 4 ? 'Normal' : (bricks === 5 ? 'Tilt Up, but Acceptable' : 'Tilt Up, Not Acceptable'))
    };
  });

  function lidarAngleRangeSelect(angleFrom, angleTo) {
    var selectedValue = String(angleFrom || '') + '|' + String(angleTo || '');
    var options = LIDAR_TILT_PROFILES.map(function(profile) {
      var value = profile.angleFrom + '|' + profile.angleTo;
      return '<option value="' + value + '"' + (value === selectedValue ? ' selected' : '') + '>' + profile.angleFrom + ' to ' + profile.angleTo + '</option>';
    }).join('');
    return '<select class="lidar-inline-input lidar-angle-range" id="li_angle_range" aria-label="Angle range" onchange="applyLidarAngleRange(this.value)">' + options + '</select>';
  }

  function getLidarTiltProfileByRange(value) {
    return LIDAR_TILT_PROFILES.filter(function(profile) {
      return profile.angleFrom + '|' + profile.angleTo === value;
    })[0] || null;
  }

  function applyLidarAngleRange(value) {
    var profile = getLidarTiltProfileByRange(value);
    if (!profile) return;
    var set = function(id, nextValue) { var el = document.getElementById(id); if (el) el.value = nextValue; };
    set('li_bricks', profile.bricks);
    set('li_height_from', profile.heightFrom);
    set('li_height_to', profile.heightTo);
    set('li_tilt_status', profile.status);
  }

  function updateLidarInlineTiltFields() {
    var bricks = Number((document.getElementById('li_bricks') || {}).value);
    if (!isFinite(bricks) || bricks < 0 || bricks > 8 || Math.floor(bricks) !== bricks) return;
    var set = function(id, value) { var el = document.getElementById(id); if (el) el.value = value; };
    var heightFrom = (bricks - 1) * 10;
    var heightTo = bricks * 10;
    var angleFrom = ((bricks - 4) * 0.38).toFixed(2);
    var angleTo = ((bricks - 3) * 0.38).toFixed(2);
    var status = bricks < 4 ? 'Tilt Down, Acceptable' : (bricks === 4 ? 'Normal' : (bricks === 5 ? 'Tilt Up, but Acceptable' : 'Tilt Up, Not Acceptable'));
    set('li_height_from', heightFrom);
    set('li_height_to', heightTo);
    set('li_tilt_status', status);
    set('li_angle_range', angleFrom + '|' + angleTo);
  }

  function saveLidarInlineEdit(event, type, index, tiltIndex) {
    var value = function(id) { var el = document.getElementById(id); return el ? el.value : ''; };
    var payload = { rowIndex:index, lidarType:type === 'lidar_tilt' ? 'tilt' : 'accuracy', robotId:value('li_robot'), date:value('li_date'), swVer:value('li_sw'), tester:value('li_tester') };
    if (payload.lidarType === 'accuracy') {
      payload.runA = { distance:value('li_d5') };
      payload.runB = { distance:value('li_d10') };
      payload.runC = { distance:value('li_d15') };
    } else {
      payload.bricks=value('li_bricks'); payload.detectedDist=value('li_detected'); payload.note=value('li_note');
    }
    var request = { action: 'updateLidarRow' };
    if (payload.lidarType === 'accuracy') request.accuracyPayload = payload;
    else request.tiltPayload = payload;

    if (payload.lidarType === 'accuracy' && document.getElementById('li_angle_range')) {
      var profile = getLidarTiltProfileByRange(value('li_angle_range'));
      if (!profile) return alert('Select a valid angle range.');
      request.tiltPayload = { rowIndex:(tiltIndex !== undefined && tiltIndex >= 0 ? tiltIndex : index), lidarType:'tilt', robotId:payload.robotId, date:payload.date, swVer:payload.swVer, tester:payload.tester,
        bricks:value('li_bricks'), detectedDist:value('li_detected'), heightFrom:value('li_height_from'), heightTo:value('li_height_to'), tiltStatus:value('li_tilt_status'), angleFrom:profile.angleFrom, angleTo:profile.angleTo, note:value('li_note') };
    }

    var button = event && event.currentTarget;
    if (button) { button.disabled = true; button.innerText = 'Saving…'; }

    // Optimistic UI: update the local model and immediately replace the
    // editor with the normal static row while Apps Script saves in background.
    var previousResponse = JSON.parse(JSON.stringify(rawLidarResponse));
    applyOptimisticLidarSave(request, index);
    activeLidarInlineEdit = null;
    renderSplitLidarTable(rawLidarResponse);

    var rollback = function(error) {
      rawLidarResponse = previousResponse;
      renderSplitLidarTable(rawLidarResponse);
      startLidarInlineEdit(type, index);
      restoreLidarDraft(request);
      alert('Update failed: ' + (error && error.message ? error.message : error));
    };

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) { rollback((result && result.error) || 'Unknown error'); return; }
        if (result.data && result.data.accuracy && result.data.tilt) {
          rawLidarResponse = result.data;
          renderSplitLidarTable(rawLidarResponse);
        }
      })
      .withFailureHandler(rollback)
      .saveLidarData(request);
  }

  function applyOptimisticLidarSave(rowData, accuracyIndex) {
    if (rowData.accuracyPayload) {
      var accuracy = rowData.accuracyPayload;
      var accuracyRows = rawLidarResponse.accuracy.rows;
      var runs = [accuracy.runA || {}, accuracy.runB || {}, accuracy.runC || {}];
      for (var runIndex = 0; runIndex < 3; runIndex++) {
        var rowIndex = accuracyIndex + runIndex;
        var row = accuracyRows[rowIndex] || [];
        while (row.length < 11) row.push('');
        if (runIndex === 0) {
          row[0] = accuracy.robotId;
          row[1] = accuracy.date;
          row[2] = accuracy.swVer;
          row[3] = accuracy.tester;
        }
        row[4] = ['A - 5', 'B - 10', 'C - 15'][runIndex];
        row[5] = runs[runIndex].distance || '';
        accuracyRows[rowIndex] = row;
      }
    }

    if (rowData.tiltPayload) {
      var tilt = rowData.tiltPayload;
      var tiltRows = rawLidarResponse.tilt.rows;
      var wantedRobot = String(tilt.robotId || '').trim().toUpperCase();
      var wantedDate = String(tilt.date || '').trim().replace(/\//g, '-');
      var tiltIndex = -1;
      for (var i = 0; i < tiltRows.length; i++) {
        if (String(tiltRows[i][0] || '').trim().toUpperCase() === wantedRobot &&
            String(tiltRows[i][1] || '').trim().replace(/\//g, '-') === wantedDate) {
          tiltIndex = i;
          break;
        }
      }
      var nextTiltRow = [tilt.robotId, tilt.date, tilt.swVer, tilt.tester, tilt.bricks, tilt.detectedDist,
        tilt.heightFrom, tilt.heightTo, tilt.tiltStatus, tilt.angleFrom, tilt.angleTo, tilt.note];
      if (tiltIndex >= 0) tiltRows[tiltIndex] = nextTiltRow;
      else tiltRows.push(nextTiltRow);
    }
  }

  function restoreLidarDraft(rowData) {
    var set = function(id, nextValue) {
      var element = document.getElementById(id);
      if (element) element.value = nextValue === undefined || nextValue === null ? '' : nextValue;
    };
    var accuracy = rowData.accuracyPayload;
    var tilt = rowData.tiltPayload;
    var shared = accuracy || tilt || {};
    set('li_robot', shared.robotId);
    set('li_date', shared.date);
    set('li_sw', shared.swVer);
    set('li_tester', shared.tester);
    if (accuracy) {
      set('li_d5', (accuracy.runA || {}).distance);
      set('li_d10', (accuracy.runB || {}).distance);
      set('li_d15', (accuracy.runC || {}).distance);
    }
    if (tilt) {
      set('li_bricks', tilt.bricks);
      set('li_detected', tilt.detectedDist);
      set('li_height_from', tilt.heightFrom);
      set('li_height_to', tilt.heightTo);
      set('li_tilt_status', tilt.tiltStatus);
      set('li_angle_range', String(tilt.angleFrom) + '|' + String(tilt.angleTo));
      set('li_note', tilt.note);
    }
  }

  function closeActionMenu(menu) {
    if (!menu) return;
    menu.classList.remove('show', 'dropup', 'is-positioned');
    menu.removeAttribute('style');
    if (menu._actionMenuTrigger) menu._actionMenuTrigger.setAttribute('aria-expanded', 'false');
    if (menu._actionMenuHome && menu._actionMenuHome.isConnected) {
      var next = menu._actionMenuNext;
      menu._actionMenuHome.insertBefore(menu, next && next.parentNode === menu._actionMenuHome ? next : null);
    } else if (menu.parentNode === document.body) {
      menu.remove();
    }
    menu._actionMenuHome = null;
    menu._actionMenuNext = null;
    menu._actionMenuTrigger = null;
  }

  function closeActionMenus(exceptMenu) {
    Array.prototype.forEach.call(document.querySelectorAll('.dropdown-menu.show'), function(menu) {
      if (menu !== exceptMenu) closeActionMenu(menu);
    });
  }

  function positionActionMenu(button, menu) {
    closeActionMenus(menu);
    if (menu.classList.contains('show')) {
      closeActionMenu(menu);
      return;
    }

    menu._actionMenuHome = menu.parentNode;
    menu._actionMenuNext = menu.nextSibling;
    menu._actionMenuTrigger = button;
    document.body.appendChild(menu);
    menu.classList.add('show', 'is-positioned');
    menu.style.visibility = 'hidden';

    var rect = button.getBoundingClientRect();
    var menuHeight = Math.max(menu.offsetHeight || 0, 120);
    var menuWidth = Math.max(menu.offsetWidth || 0, 145);
    var spaceBelow = window.innerHeight - rect.bottom;
    var openUpwards = spaceBelow < Math.max(menuHeight + 12, 160);
    var top = openUpwards ? rect.top - menuHeight - 6 : rect.bottom + 6;
    var left = rect.right - menuWidth;

    menu.classList.toggle('dropup', openUpwards);
    menu.style.top = Math.max(6, Math.min(top, window.innerHeight - menuHeight - 6)) + 'px';
    menu.style.left = Math.max(6, Math.min(left, window.innerWidth - menuWidth - 6)) + 'px';
    menu.style.visibility = 'visible';
    button.setAttribute('aria-expanded', 'true');
  }

  function bindActionMenuDelegation() {
    var tableContainer = document.getElementById('tableContainer');
    if (!tableContainer || tableContainer.dataset.actionMenuDelegated === 'true') return;
    tableContainer.dataset.actionMenuDelegated = 'true';
    tableContainer.addEventListener('click', function(event) {

      if (!button || !tableContainer.contains(button)) return;
      event.preventDefault();
      event.stopPropagation();
      var menu = document.getElementById(button.dataset.menuId || '');
      if (menu) positionActionMenu(button, menu);
    });
  }

  // Compatibility for older cached markup that still uses inline onclick.

    }
    var button = event && (event.currentTarget || (event.target && event.target.closest('.action-btn, .icon-btn-dots')));
    var menu = document.getElementById('menu_' + menuId);

  document.addEventListener('click', function(event) {
    var clickedMenu = event.target && event.target.closest ? event.target.closest('.dropdown-menu') : null;
    if (clickedMenu) {
      if (event.target.closest('.dropdown-item')) closeActionMenu(clickedMenu);

  window.addEventListener('resize', function() { closeActionMenus(); }, { passive:true });

  function deleteFromDropdown(type, index, robotId, recordDate) {
    closeActionMenus();
    var moduleKey = type === 'wifi' ? 'Wi-Fi' : (type === 'lidar_acc' ? 'LiDAR Accuracy' : 'LiDAR Tilt');
    openDeleteConfirm(moduleKey, index, function() {
      optimisticDeleteStructuredRecord(type, index, robotId, recordDate);
    });

  function optimisticDeleteStructuredRecord(type, index, robotId, recordDate) {
    var isWifi = type === 'wifi';
    var previousResponse = cloneStaticIsoResponse(isWifi ? rawWifiResponse : rawLidarResponse);
    var request;

    if (isWifi) {
      if (!rawWifiResponse.rows[index]) return handleFail('Delete failed: Wi-Fi record was not found.');
      rawWifiResponse.rows.splice(index, 1);
      renderTable(rawWifiResponse);
      request = { rowIndex:index };
    } else {
      var isAccuracy = type === 'lidar_acc';
      var sourceRows = isAccuracy ? rawLidarResponse.accuracy.rows : rawLidarResponse.tilt.rows;
      var sourceRow = sourceRows[index] || [];
      robotId = robotId || sourceRow[0] || '';
      recordDate = recordDate || sourceRow[1] || '';
      if (!sourceRow.length) return handleFail('Delete failed: LiDAR record was not found.');
      if (isAccuracy) {
        rawLidarResponse.accuracy.rows.splice(index, 3);
        rawLidarResponse.tilt.rows = rawLidarResponse.tilt.rows.filter(function(row) {
          return !(String(row[0] || '').trim().toUpperCase() === String(robotId).trim().toUpperCase() &&
            String(row[1] || '').trim().replace(/\//g, '-') === String(recordDate).trim().replace(/\//g, '-'));
        });
      } else {
        rawLidarResponse.tilt.rows.splice(index, 1);
      }
      renderSplitLidarTable(rawLidarResponse);
      request = { rowIndex:index, robotId:robotId, date:recordDate, lidarType:isAccuracy ? 'accuracy' : 'tilt' };
    }

    var rollback = function(error) {
      if (isWifi && currentTab === 'wifi') {
        rawWifiResponse = previousResponse;
        renderTable(rawWifiResponse);
      } else if (!isWifi && currentTab === 'lidar') {
        rawLidarResponse = previousResponse;
        renderSplitLidarTable(rawLidarResponse);
      }
      handleFail(error);
    };
    var saved = function(response) {
      if (!response || !response.success) {
        rollback(response && response.error ? response.error : 'Delete failed.');
        return;
      }
      localStorage.removeItem('iso_tab_cache_' + (isWifi ? 'wifi' : 'lidar'));
    };

    if (isWifi) google.script.run.withSuccessHandler(saved).withFailureHandler(rollback).deleteWifiRecord(request);
    else google.script.run.withSuccessHandler(saved).withFailureHandler(rollback).deleteLidarRecord(request);
  }

  function copyRowData(type, index) {
    closeActionMenus();
    var textToCopy = '';
    if (type === 'wifi') {
      var row = rawWifiResponse.rows[index] || [];
      textToCopy = row.map(function(c) { return (c||'').toString().trim(); }).join('\t');
    } else if (type === 'lidar_acc') {
      var r1 = rawLidarResponse.accuracy.rows[index] || [], r2 = rawLidarResponse.accuracy.rows[index+1] || [], r3 = rawLidarResponse.accuracy.rows[index+2] || [];
      textToCopy = r1.join('\t') + '\n' + r2.join('\t') + '\n' + r3.join('\t');
    } else if (type === 'lidar_tilt') {
      var row = rawLidarResponse.tilt.rows[index] || [];
      textToCopy = row.map(function(c) { return (c||'').toString().trim(); }).join('\t');
    }
    navigator.clipboard.writeText(textToCopy).then(function() {
      var toast = document.getElementById('copyToast');
      toast.innerHTML = '<span style="color:#22c55e; font-weight:800;">✔</span> <span style="margin-left:4px;">' + t('copied') + '</span>';
      toast.style.display = 'flex';
      setTimeout(function() { toast.style.display = 'none'; }, 2200);
    });
  }
