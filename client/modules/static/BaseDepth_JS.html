<script>
  var STATIC_MODULE_UI = window.STATIC_MODULE_UI || {};
  STATIC_MODULE_UI.basedepth = { key:'basedepth', title:'Base Depth Camera', method:'getBaseDepthData', renderer:'renderBaseDepthMasterDetail' };

  var activeBaseDepthRobotId = '';
  var activeBaseDepthObstacle = '3cm';
  var baseDepthShowReference = false;
  var baseDepthPasteObstacle = '3cm';
  var baseDepthFixedRealDistances = { '3cm':['32','106','35.9','35.9','120','120'], '2.5cm':['','','','','',''], '2cm':['','','','','',''] };
  var baseDepthInlineEditSheetRow = null;
  var baseDepthChoiceActiveIndex = { robot:-1, sw:-1 };
  var baseDepthChoicePositionBound = false;
  var baseDepthCohortFilter = 'all';
  var baseDepthStatusFilter = 'all';
  var baseDepthRobotFilter = '';
  var baseDepthRobotFilterTimer = 0;
  var baseDepthSidebarCollapsed = false;
  var baseDepthFovZoom = 1;
  var baseDepthFovObstacle = '3cm';
  var baseDepthFovViewMode = 'overlay';
  var baseDepthFovRunFilter = '';
  var baseDepthFovSelectedRuns = {};
  var baseDepthFovResizeBound = false;
  var baseDepthFovDrawFrame = 0;
  var BASE_DEPTH_FOV_COLORS = ['#2563eb','#7c3aed','#059669','#ea580c','#db2777','#0891b2','#ca8a04','#475569'];
  var baseDepthGuideLastFocus = null;
  var baseDepthGuideAnimationFrame = 0;
  var BASE_DEPTH_TOLERANCE_M = 0.05;
  var BASE_DEPTH_REFERENCE_COORDS = {
    '3cm': { 1:{x:22,y:0}, 2:{x:100,y:0}, 3:{x:22,y:-18}, 4:{x:22,y:18}, 5:{x:100,y:-58}, 6:{x:100,y:58} },
    '2.5cm': { 1:{x:26,y:0}, 2:{x:52,y:0}, 3:{x:26,y:16}, 4:{x:26,y:-16}, 5:{x:49,y:21}, 6:{x:49,y:-21} },
    '2cm': { 1:{x:26,y:0}, 2:{x:52,y:0}, 3:{x:26,y:16}, 4:{x:26,y:-16}, 5:{x:49,y:21}, 6:{x:49,y:-21} }
  };

  function findBaseDepthColumn(headers, patterns, fallback) {
    for (var column = 0; column < headers.length; column++) {
      var label = String(headers[column] || '').toLowerCase().replace(/[_-]+/g, ' ');
      if (patterns.some(function(pattern) { return pattern.test(label); })) return column;
    }
    return fallback !== undefined && fallback < headers.length ? fallback : -1;
  }

  function getBaseDepthColumns(response) {
    var headers = response.headers || [];
    var columns = {
      robot:0, sw:1, date:2, tester:3, obstacle:5, point:6, scriptDist:7,
      realDist:9, distanceStd:10, coordX:15, coordY:16, coord:-1, accuracy:10, delta:11, projector:12, status:12
    };
    // Reference mode is an extension of the main table. Keep only the
    // measurement fields needed to compare the selected point; do not append
    // every unrelated sheet column.
    columns.reference = [];
    [columns.accuracy, columns.delta, columns.projector].forEach(function(index) {
      if (index >= 0 && index < headers.length && columns.reference.indexOf(index) === -1) columns.reference.push(index);
    });
    return columns;
  }

  function baseDepthNumber(value) {
    var parsed = parseFloat(String(value === null || value === undefined ? '' : value).replace(',', '.').replace(/[^0-9+\-.]/g, ''));
    return isFinite(parsed) ? parsed : null;
  }

  function calculateBaseDepthResult(scriptDistance, realDistanceCm) {
    var script = baseDepthNumber(scriptDistance);
    var realCm = baseDepthNumber(realDistanceCm);
    if (script === null || realCm === null) return { delta:null, accuracy:null, status:'Pending' };
    var delta = (realCm / 100) - script;
    var accuracy = script === 0 ? null : Math.max(0, (1 - Math.abs(delta) / Math.abs(script)) * 100);
    return { delta:delta, accuracy:accuracy, status:Math.abs(delta) <= BASE_DEPTH_TOLERANCE_M + 1e-9 ? 'Pass' : 'Fail' };
  }

  function normalizeBaseDepthObstacle(value) {
    var text = String(value || '').toLowerCase().replace(/\s+/g, '');
    if (/2\.5cm|25mm/.test(text)) return '2.5cm';
    if (/3(?:\.0)?cm|30mm/.test(text)) return '3cm';
    if (/2(?:\.0)?cm|20mm/.test(text)) return '2cm';
    if (text === '2.5' || text.indexOf('2.5') !== -1) return '2.5cm';
    if (text === '3' || text.indexOf('3') !== -1) return '3cm';
    if (text === '2' || text.indexOf('2') !== -1) return '2cm';
    return '';
  }

  function getBaseDepthObstacleRows(group, columns) {
    var result = { '3cm':[], '2.5cm':[], '2cm':[] };
    var activeSize = '3cm';
    var hasExplicit25 = (group.rows || []).some(function(row) { return columns.obstacle >= 0 && normalizeBaseDepthObstacle(row[columns.obstacle]) === '2.5cm'; });
    (group.rows || []).forEach(function(row, index) {
      var explicitSize = columns.obstacle >= 0 ? normalizeBaseDepthObstacle(row[columns.obstacle]) : '';
      if (explicitSize) activeSize = explicitSize;
      else if (hasExplicit25) activeSize = index < 6 ? '3cm' : (index < 12 ? '2.5cm' : '2cm');
      else if (index === 6) activeSize = '2cm';
      var size = explicitSize || activeSize;
      if (result[size]) result[size].push({ row:row, groupIndex:index, sourceIndex:(group.sourceIndex || 0) + index });
    });
    return result;
  }

  function getBaseDepthRowStatus(row, columns) { return calculateBaseDepthResult(row[columns.scriptDist], row[columns.realDist]); }

  function getBaseDepthDisplayedStatus(row) {
    var value = String(row[12] || '').trim().toLowerCase();
    if (value === 'pass') return 'Pass';
    if (value === 'fail') return 'Fail';
    return 'Pending';
  }

  function getBaseDepthGroupState(group, columns) {
    var results = group.rows.map(function(row) { return getBaseDepthDisplayedStatus(row); }).filter(function(status) { return status !== 'Pending'; });
    if (!results.length) return { key:'pending', label:'Pending' };
    if (results.some(function(status) { return status === 'Fail'; })) return { key:'fail', label:'Review' };
    return { key:'pass', label:'Pass' };
  }

  function lastBaseDepthGroupValue(group, column) {
    if (column < 0) return '';
    for (var index = group.rows.length - 1; index >= 0; index--) {
      var value = String(group.rows[index][column] || '').trim();
      if (value) return value;
    }
    return '';
  }

  function selectBaseDepthRobot(robotId) { activeBaseDepthRobotId = robotId; if (rawModuleResponse) renderBaseDepthMasterDetail(rawModuleResponse, groupModuleRowsByRobot(rawModuleResponse)); }
  function setBaseDepthCohortFilter(filter) { baseDepthCohortFilter = filter || 'all'; if (rawModuleResponse) renderBaseDepthMasterDetail(rawModuleResponse, groupModuleRowsByRobot(rawModuleResponse)); }
  function setBaseDepthStatusFilter(filter) { baseDepthStatusFilter = filter || 'all'; if (rawModuleResponse) renderBaseDepthMasterDetail(rawModuleResponse, groupModuleRowsByRobot(rawModuleResponse)); }
  function setBaseDepthRobotFilter(value) {
    baseDepthRobotFilter = String(value || '').toLowerCase().trim();
    if (baseDepthRobotFilterTimer) clearTimeout(baseDepthRobotFilterTimer);
    baseDepthRobotFilterTimer = setTimeout(function() {
      baseDepthRobotFilterTimer = 0;
      if (!rawModuleResponse) return;
      renderBaseDepthMasterDetail(rawModuleResponse, groupModuleRowsByRobot(rawModuleResponse));
      var input = document.querySelector('.bd-robot-search');
      if (input) { input.focus({ preventScroll:true }); input.setSelectionRange(input.value.length, input.value.length); }
    }, 140);
  }
  function resetBaseDepthFilters() { baseDepthCohortFilter = 'all'; baseDepthStatusFilter = 'all'; baseDepthRobotFilter = ''; if (rawModuleResponse) renderBaseDepthMasterDetail(rawModuleResponse, groupModuleRowsByRobot(rawModuleResponse)); }
  function selectBaseDepthObstacle(size) { activeBaseDepthObstacle = size === '2.5cm' || size === '2cm' ? size : '3cm'; if (rawModuleResponse) renderBaseDepthMasterDetail(rawModuleResponse, groupModuleRowsByRobot(rawModuleResponse)); }
  function toggleBaseDepthReferenceData(checked) { baseDepthShowReference = !!checked; if (rawModuleResponse) renderBaseDepthMasterDetail(rawModuleResponse, groupModuleRowsByRobot(rawModuleResponse)); }
  function toggleBaseDepthSidebar() { baseDepthSidebarCollapsed = !baseDepthSidebarCollapsed; if (rawModuleResponse) renderBaseDepthMasterDetail(rawModuleResponse, groupModuleRowsByRobot(rawModuleResponse)); }

  function ensureBaseDepthFovModal() {
    var modal = document.getElementById('baseDepthFovModal');
    if (modal) return modal;
    modal = document.createElement('div');
    modal.id = 'baseDepthFovModal';
    modal.className = 'modal-overlay base-depth-fov-overlay';
    modal.onclick = function(event) { if (event.target === modal) closeBaseDepthFovModal(); };
    document.body.appendChild(modal);
    return modal;
  }

  function openBaseDepthFovModal() {
    if (!rawModuleResponse) return;
    var modal = ensureBaseDepthFovModal();
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    baseDepthFovSelectedRuns = {};
    groups.forEach(function(group, index) { baseDepthFovSelectedRuns[group.id] = group.id === activeBaseDepthRobotId || (!activeBaseDepthRobotId && index === 0); });
    baseDepthFovRunFilter = '';
    baseDepthFovObstacle = activeBaseDepthObstacle === '3cm' ? '3cm' : 'combined';
    baseDepthFovViewMode = 'overlay';
    baseDepthFovZoom = 1;
    modal.innerHTML = '<div class="base-depth-fov-modal" role="dialog" aria-modal="true" aria-labelledby="baseDepthFovTitle"><header class="base-depth-fov-header"><div><span>ENGINEERING INSPECTION</span><h3 id="baseDepthFovTitle">Base Depth Camera FOV</h3><p>Choose one measurement family or compare all obstacle heights in the same coordinate frame.</p></div><button type="button" onclick="closeBaseDepthFovModal()" aria-label="Close FOV inspection"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></header><div class="fov-engineering-toolbar"><div class="fov-toolbar-group"><span>Obstacle family</span><div class="fov-segmented" id="fovObstacleSegments"><button type="button" data-value="3cm" onclick="setBaseDepthFovObstacle(\'3cm\')">3 cm</button><button type="button" data-value="combined" onclick="setBaseDepthFovObstacle(\'combined\')">2 / 2.5 cm</button><button type="button" data-value="all" onclick="setBaseDepthFovObstacle(\'all\')">All</button></div></div><div class="fov-toolbar-group"><span>Layout</span><div class="fov-segmented" id="fovViewSegments"><button type="button" data-value="overlay" onclick="setBaseDepthFovViewMode(\'overlay\')">Overlay</button><button type="button" data-value="grid" onclick="setBaseDepthFovViewMode(\'grid\')">Grid</button></div></div><div class="fov-canvas-tools" aria-label="Canvas controls"><button type="button" onclick="zoomBaseDepthFov(-.25)" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 18 18"><circle cx="7.5" cy="7.5" r="4.5"/><path d="M11 11l4 4M5.5 7.5h4"/></svg></button><button type="button" onclick="resetBaseDepthFovZoom()" aria-label="Reset to fit" title="Reset to fit"><svg viewBox="0 0 18 18"><path d="M3 7V3h4M15 11v4h-4M15 7V3h-4M3 11v4h4"/></svg></button><button type="button" onclick="zoomBaseDepthFov(.25)" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 18 18"><circle cx="7.5" cy="7.5" r="4.5"/><path d="M11 11l4 4M5.5 7.5h4M7.5 5.5v4"/></svg></button></div><button type="button" class="fov-export-button" onclick="exportBaseDepthFovPlots()">Export</button></div><div class="fov-engineering-workspace"><main class="fov-engineering-stage"><canvas id="baseDepthFovCanvas" class="fov-engineering-canvas"></canvas><div class="fov-plot-status"><span id="fovVisibleRunCount">0 runs</span><code id="fovViewportLabel">X −40…160 · Y −60…60 cm</code></div></main><aside class="fov-run-sidebar"><header><div><span>COMPARISON RUNS</span><strong id="fovRunSummary">0 selected</strong></div><div class="fov-run-actions"><button type="button" onclick="showOnlyActiveBaseDepthFovRun()">Current</button><button type="button" onclick="selectAllBaseDepthFovRuns()">All</button></div></header><label class="fov-run-search"><span aria-hidden="true">⌕</span><input type="search" placeholder="Filter run ID…" oninput="setBaseDepthFovRunFilter(this.value)" aria-label="Filter FOV test runs"></label><div id="fovRunList" class="fov-run-list"></div></aside></div></div>';
    modal.style.display = 'flex';
    renderFovChart();
    bindBaseDepthFovCanvas();
  }

  function closeBaseDepthFovModal() {
    var modal = document.getElementById('baseDepthFovModal');
    if (modal) modal.style.display = 'none';
    var tooltip = document.getElementById('baseDepthFovPointTooltip');
    if (tooltip) tooltip.style.display = 'none';
  }

  function getBaseDepthFovPoint(row, size, pointNumber) {
    var measuredX = baseDepthNumber(row[15]);
    var measuredY = baseDepthNumber(row[16]);
    if (measuredX !== null && measuredY !== null) return { x:measuredX, y:measuredY, source:'measured' };
    var ref = (BASE_DEPTH_REFERENCE_COORDS[size] || BASE_DEPTH_REFERENCE_COORDS['2cm'])[pointNumber] || {x:30,y:0};
    return { x:ref.x, y:ref.y, source:'reference' };
  }

  function baseDepthFovPoints(rows, size) {
    var points = [];
    (rows || []).forEach(function(row) {
      var rowSize = normalizeBaseDepthObstacle(row[5]);
      var matches = size === 'all' || (size === 'combined' && (rowSize === '2cm' || rowSize === '2.5cm')) || rowSize === size;
      if (!matches) return;
      var pointNumber = parseInt(row[6], 10);
      if (pointNumber >= 1 && pointNumber <= 6) points.push({ size:rowSize, point:String(pointNumber), value:getBaseDepthFovPoint(row, rowSize, pointNumber) });
    });
    return points;
  }

  function baseDepthFovFamilies() {
    if (baseDepthFovObstacle === 'all') return ['3cm', '2cm', '2.5cm'];
    if (baseDepthFovObstacle === 'combined') return ['2cm', '2.5cm'];
    return [baseDepthFovObstacle];
  }

  function renderFovChart() {
    var canvas = document.getElementById('baseDepthFovCanvas');
    if (!canvas || !rawModuleResponse) return;
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    var selectedGroups = groups.filter(function(group) { return baseDepthFovSelectedRuns[group.id] !== false; });
    renderBaseDepthFovRunList(groups, selectedGroups.length);
    updateBaseDepthFovControls(selectedGroups.length);
    drawBaseDepthFovInspection(canvas, selectedGroups);
  }

  function redrawBaseDepthFovCanvas() {
    var canvas = document.getElementById('baseDepthFovCanvas');
    if (!canvas || !rawModuleResponse) return;
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    var selectedGroups = groups.filter(function(group) { return baseDepthFovSelectedRuns[group.id] !== false; });
    updateBaseDepthFovControls(selectedGroups.length);
    drawBaseDepthFovInspection(canvas, selectedGroups);
  }

  function scheduleBaseDepthFovRedraw() {
    if (baseDepthFovDrawFrame) cancelAnimationFrame(baseDepthFovDrawFrame);
    baseDepthFovDrawFrame = requestAnimationFrame(function() {
      baseDepthFovDrawFrame = 0;
      redrawBaseDepthFovCanvas();
    });
  }

  function renderBaseDepthFovRunList(groups, selectedCount) {
    var list = document.getElementById('fovRunList');
    if (!list) return;
    var filtered = groups.map(function(group, index) { return { group:group, index:index }; }).filter(function(item) {
      return !baseDepthFovRunFilter || String(item.group.id || '').toLowerCase().indexOf(baseDepthFovRunFilter) !== -1;
    });
    list.innerHTML = filtered.map(function(item) {
      var group = item.group, index = item.index;
      var color = BASE_DEPTH_FOV_COLORS[index % BASE_DEPTH_FOV_COLORS.length];
      var selected = baseDepthFovSelectedRuns[group.id] !== false;
      return '<label class="fov-run-item ' + (selected ? 'is-selected' : '') + '"><input type="checkbox" ' + (selected ? 'checked ' : '') + 'onchange="toggleBaseDepthFovRunByIndex(' + index + ',this.checked)"><i style="--run-color:' + color + '"></i><span><strong>' + escapeHtml(group.id) + '</strong><small>' + group.rows.length + ' samples</small></span><em>' + (selected ? 'Visible' : 'Hidden') + '</em></label>';
    }).join('');
    if (!filtered.length) list.innerHTML = '<div class="fov-run-empty">No matching run</div>';
    var summary = document.getElementById('fovRunSummary');
    if (summary) summary.textContent = selectedCount + ' of ' + groups.length + ' selected';
  }

  function setBaseDepthFovRunFilter(value) {
    baseDepthFovRunFilter = String(value || '').trim().toLowerCase();
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    renderBaseDepthFovRunList(groups, groups.filter(function(group) { return baseDepthFovSelectedRuns[group.id] !== false; }).length);
  }

  function showOnlyActiveBaseDepthFovRun() {
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    groups.forEach(function(group, index) { baseDepthFovSelectedRuns[group.id] = group.id === activeBaseDepthRobotId || (!activeBaseDepthRobotId && index === 0); });
    renderFovChart();
  }

  function selectAllBaseDepthFovRuns() {
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    groups.forEach(function(group) { baseDepthFovSelectedRuns[group.id] = true; });
    renderFovChart();
  }

  function updateBaseDepthFovControls(selectedCount) {
    Array.prototype.forEach.call(document.querySelectorAll('#fovObstacleSegments button'), function(button) { button.classList.toggle('active', button.dataset.value === baseDepthFovObstacle); });
    Array.prototype.forEach.call(document.querySelectorAll('#fovViewSegments button'), function(button) { button.classList.toggle('active', button.dataset.value === baseDepthFovViewMode); });
    var count = document.getElementById('fovVisibleRunCount');
    if (count) count.textContent = selectedCount + (selectedCount === 1 ? ' run' : ' runs') + ' visible';
    var viewport = document.getElementById('fovViewportLabel');
    if (viewport) {
      var xHalf = 100 / baseDepthFovZoom, yHalf = 60 / baseDepthFovZoom;
      viewport.textContent = 'X ' + Math.round(60-xHalf) + '…' + Math.round(60+xHalf) + ' · Y ' + Math.round(-yHalf) + '…' + Math.round(yHalf) + ' cm';
    }
  }

  function setBaseDepthFovObstacle(size) {
    baseDepthFovObstacle = ['3cm', 'combined', 'all'].indexOf(size) !== -1 ? size : '3cm';
    baseDepthFovZoom = 1;
    redrawBaseDepthFovCanvas();
  }

  function setBaseDepthFovViewMode(mode) {
    baseDepthFovViewMode = mode === 'grid' ? 'grid' : 'overlay';
    baseDepthFovZoom = 1;
    redrawBaseDepthFovCanvas();
  }

  function toggleBaseDepthFovRun(robotId, selected) {
    baseDepthFovSelectedRuns[robotId] = !!selected;
    renderFovChart();
  }

  function toggleBaseDepthFovRunByIndex(index, selected) {
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    if (groups[index]) toggleBaseDepthFovRun(groups[index].id, selected);
  }

  function toggleAllBaseDepthFovRuns() {
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    var shouldSelect = groups.some(function(group) { return baseDepthFovSelectedRuns[group.id] === false; });
    groups.forEach(function(group) { baseDepthFovSelectedRuns[group.id] = shouldSelect; });
    renderFovChart();
  }

  function zoomBaseDepthFov(delta) {
    baseDepthFovZoom = Math.max(.75, Math.min(3, baseDepthFovZoom + delta));
    scheduleBaseDepthFovRedraw();
  }

  function resetBaseDepthFovZoom() { baseDepthFovZoom = 1; redrawBaseDepthFovCanvas(); }

  function bindBaseDepthFovCanvas() {
    var canvas = document.getElementById('baseDepthFovCanvas');
    if (!canvas || canvas.dataset.bound === 'true') return;
    canvas.dataset.bound = 'true';
    canvas.addEventListener('mousemove', handleBaseDepthFovHover);
    canvas.addEventListener('mouseleave', function() { var tooltip = document.getElementById('baseDepthFovPointTooltip'); if (tooltip) tooltip.style.display = 'none'; });
    canvas.addEventListener('wheel', function(event) { event.preventDefault(); zoomBaseDepthFov(event.deltaY < 0 ? .25 : -.25); }, { passive:false });
    if (!baseDepthFovResizeBound) {
      baseDepthFovResizeBound = true;
      window.addEventListener('resize', function() {
        var modal = document.getElementById('baseDepthFovModal');
        if (modal && modal.style.display !== 'none') scheduleBaseDepthFovRedraw();
      }, { passive:true });
    }
  }

  function handleBaseDepthFovHover(event) {
    var canvas = event.currentTarget;
    var rect = canvas.getBoundingClientRect();
    var x = event.clientX - rect.left, y = event.clientY - rect.top;
    var hit = (canvas._fovHits || []).reduce(function(best, item) {
      var distance = Math.hypot(item.px - x, item.py - y);
      return distance <= 14 && (!best || distance < best.distance) ? { item:item, distance:distance } : best;
    }, null);
    var tooltip = ensureBaseDepthFovPointTooltip();
    if (!hit) { tooltip.style.display = 'none'; return; }
    tooltip.innerHTML = '<strong>' + escapeHtml(hit.item.run) + ' · P' + hit.item.point + '</strong><code>(' + hit.item.x.toFixed(2) + ', ' + hit.item.y.toFixed(2) + ') cm</code><span>Δ ' + hit.item.delta.toFixed(2) + ' cm</span>';
    tooltip.style.left = Math.min(event.clientX + 14, window.innerWidth - 280) + 'px';
    tooltip.style.top = Math.max(8, event.clientY - 58) + 'px';
    tooltip.style.display = 'flex';
  }

  function exportBaseDepthFovPlots() {
    var canvas = document.getElementById('baseDepthFovCanvas');
    if (!canvas) return;
    var link = document.createElement('a');
    link.download = 'base-depth-fov-' + baseDepthFovViewMode + '-' + baseDepthFovObstacle.replace(/[^a-z0-9]+/gi, '_') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function exportBaseDepthFovFromMain() {
    openBaseDepthFovModal();
    setTimeout(exportBaseDepthFovPlots, 80);
  }

  function getBaseDepthPlacementGuideMarkup() {
    var template = document.getElementById('baseDepthPlacementGuideTemplate');
    return template ? template.innerHTML : '<p class="base-depth-guide-missing">Object placement guide is unavailable.</p>';
  }

  function ensureBaseDepthPlacementDrawer() {
    var drawer = document.getElementById('baseDepthPlacementDrawer');
    if (drawer) return drawer;
    drawer = document.createElement('div');
    drawer.id = 'baseDepthPlacementDrawer';
    drawer.className = 'base-depth-guide-overlay';
    drawer.hidden = true;
    drawer.innerHTML = '<aside class="base-depth-guide-drawer" role="dialog" aria-modal="true" aria-labelledby="baseDepthGuideTitle" aria-describedby="baseDepthGuideSubtitle" tabindex="-1">' +
      '<header class="base-depth-guide-header"><div><span class="base-depth-guide-kicker">TEST SETUP REFERENCE</span><h2 id="baseDepthGuideTitle">Object Placement Guide</h2><p id="baseDepthGuideSubtitle">Place each obstacle at points 1–6 before recording the Base Depth test.</p></div><button type="button" class="base-depth-guide-close" onclick="closeBaseDepthPlacementDrawer()" aria-label="Close object placement guide"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></header>' +
      '<div class="base-depth-guide-body"><section class="base-depth-guide-summary" aria-label="Placement specifications"><div class="base-depth-guide-tags"><span><i class="guide-dot guide-dot-red"></i>3 cm detection area</span><span><i class="guide-dot guide-dot-blue"></i>2 / 2.5 cm detection area</span><span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 12.5l10-10M5 2.5h7.5V10"/></svg>Coordinates in cm</span></div><p>The diagrams show physical object placement only. Measured robot results remain available in <strong>View FOV Plot</strong>.</p></section><div class="base-depth-guide-tabs" role="tablist" aria-label="Detection area"><button type="button" role="tab" aria-selected="true" onclick="setBaseDepthGuidePanel(\'3cm\',this)"><i class="guide-dot guide-dot-red"></i>3 cm area</button><button type="button" role="tab" aria-selected="false" tabindex="-1" onclick="setBaseDepthGuidePanel(\'2cm\',this)"><i class="guide-dot guide-dot-blue"></i>2 / 2.5 cm area</button></div><figure class="base-depth-guide-figure">' + getBaseDepthPlacementGuideMarkup() + '<figcaption id="baseDepthGuideCaption">3 cm detection area · Top view and six numbered positions</figcaption></figure></div>' +
      '</aside>';
    drawer.addEventListener('click', function(event) { if (event.target === drawer) closeBaseDepthPlacementDrawer(); });
    drawer.addEventListener('keydown', function(event) {
      if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && event.target.getAttribute('role') === 'tab') {
        event.preventDefault();
        var tabs = Array.prototype.slice.call(drawer.querySelectorAll('.base-depth-guide-tabs [role="tab"]'));
        var nextIndex = (tabs.indexOf(event.target) + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
        tabs[nextIndex].click();
        tabs[nextIndex].focus();
        return;
      }
      if (event.key !== 'Tab') return;

  function drawBaseDepthFovInspection(canvas, groups) {
    var stage = canvas.parentElement;

    var height = baseDepthFovViewMode === 'grid'
      ? Math.max(stage.clientHeight || 560, Math.ceil(groups.length / 2) * 270)

    var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, width, height);
    canvas._fovHits = [];

    if (!groups.length) {
      ctx.fillStyle = '#64748b'; ctx.font = '13px Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Select at least one test run', width / 2, height / 2);
      return;
    }

    if (baseDepthFovViewMode === 'grid') {
      var columns = groups.length === 1 ? 1 : 2;
      var rows = Math.ceil(groups.length / columns);
      var cellWidth = width / columns, cellHeight = height / rows;
      groups.forEach(function(group, index) {
        var area = { x:(index % columns) * cellWidth, y:Math.floor(index / columns) * cellHeight, width:cellWidth, height:cellHeight };
        ctx.save(); ctx.beginPath(); ctx.rect(area.x, area.y, area.width, area.height); ctx.clip();
        drawBaseDepthFovViewport(ctx, canvas, [group], area, true);
        ctx.restore();
      });
    } else {
      drawBaseDepthFovViewport(ctx, canvas, groups, { x:0, y:0, width:width, height:height }, false);
    }
  }

  function drawBaseDepthFovViewport(ctx, canvas, groups, area, compact) {
    var centerX = 60, centerY = 0;
    var xHalf = 100 / baseDepthFovZoom, yHalf = 60 / baseDepthFovZoom;
    var range = { minX:centerX-xHalf, maxX:centerX+xHalf, minY:centerY-yHalf, maxY:centerY+yHalf };
    var pad = compact ? { left:46, right:14, top:34, bottom:34 } : { left:58, right:24, top:28, bottom:48 };
    var left = area.x + pad.left, right = area.x + area.width - pad.right;
    var top = area.y + pad.top, bottom = area.y + area.height - pad.bottom;
    var sx = function(x) { return left + (x - range.minX) / (range.maxX - range.minX) * (right - left); };
    var sy = function(y) { return bottom - (y - range.minY) / (range.maxY - range.minY) * (bottom - top); };

    ctx.fillStyle = '#fff'; ctx.fillRect(area.x + 1, area.y + 1, area.width - 2, area.height - 2);
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1; ctx.strokeRect(area.x + .5, area.y + .5, area.width - 1, area.height - 1);
    ctx.font = (compact ? '9px' : '10px') + ' "SFMono-Regular",Consolas,monospace';
    ctx.strokeStyle = '#e8edf3'; ctx.fillStyle = '#64748b';
    for (var gx = Math.ceil(range.minX / 20) * 20; gx <= range.maxX; gx += 20) {
      ctx.beginPath(); ctx.moveTo(sx(gx), top); ctx.lineTo(sx(gx), bottom); ctx.stroke();
      ctx.textAlign = 'center'; ctx.fillText(gx, sx(gx), bottom + 18);
    }
    for (var gy = Math.ceil(range.minY / 20) * 20; gy <= range.maxY; gy += 20) {
      ctx.beginPath(); ctx.moveTo(left, sy(gy)); ctx.lineTo(right, sy(gy)); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillText(gy, left - 8, sy(gy) + 3);
    }
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.2;
    if (range.minY <= 0 && range.maxY >= 0) { ctx.beginPath(); ctx.moveTo(left, sy(0)); ctx.lineTo(right, sy(0)); ctx.stroke(); }
    if (range.minX <= 0 && range.maxX >= 0) { ctx.beginPath(); ctx.moveTo(sx(0), top); ctx.lineTo(sx(0), bottom); ctx.stroke(); }

    if (!compact) {
      ctx.fillStyle = '#475569'; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('X FRONT (cm)', (left + right) / 2, area.y + area.height - 10);
      ctx.save(); ctx.translate(area.x + 14, (top + bottom) / 2); ctx.rotate(-Math.PI/2); ctx.fillText('Y LEFT (cm)', 0, 0); ctx.restore();
    }
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.4;
    ctx.strokeRect(sx(-35), sy(18), sx(-5)-sx(-35), sy(-18)-sy(18));
    ctx.fillStyle = '#64748b'; ctx.font = '9px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('ROBOT', sx(-20), sy(-24));

    var allGroups = groupModuleRowsByRobot(rawModuleResponse) || [];
    groups.forEach(function(group) {
      var seriesIndex = allGroups.findIndex(function(candidate) { return candidate.id === group.id; });
      var color = BASE_DEPTH_FOV_COLORS[(seriesIndex < 0 ? 0 : seriesIndex) % BASE_DEPTH_FOV_COLORS.length];
      var pointMap = baseDepthFovPoints(group.rows, baseDepthFovObstacle);
      var points = pointMap.map(function(entry) {
        var point = entry.value;
        var reference = (BASE_DEPTH_REFERENCE_COORDS[entry.size] || {})[entry.point] || point;
        return { point:entry.point, size:entry.size, x:point.x, y:point.y, delta:Math.hypot(point.x-reference.x, point.y-reference.y) };
      });
      if (!points.length) return;
      baseDepthFovFamilies().forEach(function(family, familyIndex) {
        var familyPoints = points.filter(function(point) { return point.size === family; });
        if (familyPoints.length < 3) return;
        var polygon = familyPoints.slice().sort(function(a,b) {
          var ax = familyPoints.reduce(function(sum,p){return sum+p.x;},0)/familyPoints.length;
          var ay = familyPoints.reduce(function(sum,p){return sum+p.y;},0)/familyPoints.length;
          return Math.atan2(a.y-ay,a.x-ax)-Math.atan2(b.y-ay,b.x-ax);
        });

        polygon.slice(1).forEach(function(point){ctx.lineTo(sx(point.x),sy(point.y));}); ctx.closePath();
        ctx.fillStyle = fovColorWithAlpha(color, familyIndex ? .045 : .08); ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = compact ? 1.5 : 2; ctx.setLineDash(familyIndex ? [5,3] : []); ctx.stroke(); ctx.setLineDash([]);
      });

        var pointLabel = (baseDepthFovObstacle === 'combined' || baseDepthFovObstacle === 'all') ? point.size.replace('cm','') + '·' + point.point : point.point;
        if (!compact || groups.length === 1) { ctx.fillStyle='#0f172a'; ctx.font='700 10px Inter, sans-serif'; ctx.textAlign='left'; ctx.fillText(pointLabel,px+7,py-7); }
        canvas._fovHits.push({px:px,py:py,run:group.id,point:pointLabel,x:point.x,y:point.y,delta:point.delta});
      });
      if (compact) { ctx.fillStyle=color; ctx.font='700 10px "SFMono-Regular",Consolas,monospace'; ctx.textAlign='left'; ctx.fillText(group.id,area.x+10,area.y+17); }
    });
  }

hile a 3cm or 2cm section is focused.</span></div>' +

  function normalizeBaseDepthRobotChoice(value) {

  }

  function baseDepthChoiceKey(kind, value) {
    var text = String(value || '').trim().replace(/\s+/g, ' ');
    return kind === 'robot' ? text.toLowerCase().replace(/\s+/g, '') : text.toLowerCase();
  }

  function getBaseDepthChoiceValues(kind) {
    var values = [];
    try {
      var stored = JSON.parse(localStorage.getItem(kind === 'robot' ? 'registered_robot_names' : 'registered_sw_versions') || '[]');
      if (Array.isArray(stored)) values = values.concat(stored);
    } catch (e) { /* use loaded values */ }
    if (kind === 'sw' && Array.isArray(registeredSwVersionNames)) values = values.concat(registeredSwVersionNames);
    var list = document.getElementById(kind === 'robot' ? 'registeredRobotList' : 'registeredSwVersionList');
    if (list) Array.prototype.forEach.call(list.options, function(option) { values.push(option.value); });
    var unique = {};
    return values.map(function(value) {
      var text = kind === 'robot' ? normalizeBaseDepthRobotChoice(value) : String(value || '').trim().replace(/\s+/g, ' ');
      var key = baseDepthChoiceKey(kind, text);
      if (!text || !key || unique[key]) return null;
      unique[key] = true;
      return text;
    }).filter(Boolean).sort(function(a, b) { return a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}); });
  }

  function baseDepthCanonicalChoice(kind, value) {

    return match || (kind === 'robot' ? normalizeBaseDepthRobotChoice(value) : String(value || '').trim().replace(/\s+/g, ' '));
  }

  function canonicalizeBaseDepthChoice(kind) {

  function positionBaseDepthChoice(kind) {

    if (!input || !list || list.hidden) return;
    var rect = input.getBoundingClientRect();
    var maxHeight = Math.min(260, Math.max(120, window.innerHeight - 24));
    var below = window.innerHeight - rect.bottom - 8;
    var above = rect.top - 8;
    var placeAbove = below < Math.min(190, list.scrollHeight) && above > below;
    var height = Math.min(maxHeight, placeAbove ? above : below);
    list.style.position = 'fixed';
    list.style.left = Math.max(8, rect.left) + 'px';
    list.style.width = Math.min(rect.width, window.innerWidth - Math.max(8, rect.left) - 8) + 'px';
    list.style.maxHeight = Math.max(100, height) + 'px';
    list.style.top = (placeAbove ? Math.max(8, rect.top - Math.max(100, height) - 6) : rect.bottom + 6) + 'px';

  function navigateBaseDepthChoices(event, kind) {

      var step = event.key === 'ArrowDown' ? 1 : -1;
      baseDepthChoiceActiveIndex[kind] = (baseDepthChoiceActiveIndex[kind] + step + options.length) % options.length;
      Array.prototype.forEach.call(options, function(option, index) { option.classList.toggle('active', index === baseDepthChoiceActiveIndex[kind]); });
      if (options[baseDepthChoiceActiveIndex[kind]]) options[baseDepthChoiceActiveIndex[kind]].scrollIntoView({block:'nearest'});
    } else if (event.key === 'Enter' && baseDepthChoiceActiveIndex[kind] >= 0 && options[baseDepthChoiceActiveIndex[kind]]) {
      event.preventDefault();
      chooseBaseDepthChoice(kind, options[baseDepthChoiceActiveIndex[kind]].dataset.value);

  function buildBaseDepthFixedRealDistances(groups, columns) {
    var profile = { '3cm':['32','106','35.9','35.9','120','120'], '2.5cm':['','','','','',''], '2cm':['','','','','',''] };
    var votes = { '3cm':Array.from({length:6}, function(){ return {}; }), '2.5cm':Array.from({length:6}, function(){ return {}; }), '2cm':Array.from({length:6}, function(){ return {}; }) };
    (groups || []).forEach(function(group) {
      var bySize = getBaseDepthObstacleRows(group, columns);
      Object.keys(votes).forEach(function(size) {
        (bySize[size] || []).slice(0,6).forEach(function(item, index) {
          var value = baseDepthNumber(item.row[columns.realDist]);
          if (value === null) return;
          var key = String(Number(value.toFixed(3)));
          votes[size][index][key] = (votes[size][index][key] || 0) + 1;
        });
      });
    });
    Object.keys(votes).forEach(function(size) {
      votes[size].forEach(function(counts, index) {
        var winner = '';
        Object.keys(counts).forEach(function(value) { if (!winner || counts[value] > counts[winner]) winner = value; });
        if (winner) profile[size][index] = winner;
      });
    });
    return profile;
  }

  function prefillBaseDepthEntryFromExistingData(robotId, columns) {
    var groups = groupModuleRowsByRobot(rawModuleResponse) || [];
    var group = groups.filter(function(item) { return item.id === robotId; })[0];
    if (!group) return;
    var obstacleRows = getBaseDepthObstacleRows(group, columns);
    ['3cm', '2.5cm', '2cm'].forEach(function(size) {
      (obstacleRows[size] || []).slice(0, 6).forEach(function(item, index) {
        var point = index + 1;
        var projector = getBaseDepthEntryField(size, point, 'projector');
        if (projector && !projector.value) projector.value = String(item.row[columns.projector || columns.status] || '').trim();
        if (projector) setBaseDepthProjectorState(projector);
      });
    });
  }

  function setBaseDepthProjectorState(select) {

  function updateBaseDepthEntryCalc(size, point) {
    var result = calculateBaseDepthResult(getBaseDepthEntryField(size,point,'script').value, baseDepthFixedRealDistances[size][point - 1]);
    var accuracy = document.querySelector('[data-bd-calc="accuracy"][data-size="' + size + '"][data-point="' + point + '"]');
    var delta = document.querySelector('[data-bd-calc="delta"][data-size="' + size + '"][data-point="' + point + '"]');
    var status = document.querySelector('[data-bd-calc="status"][data-size="' + size + '"][data-point="' + point + '"]');
    if (accuracy) accuracy.innerText = result.accuracy === null ? '—' : result.accuracy.toFixed(2) + '%';
    if (delta) delta.innerText = result.delta === null ? '—' : (result.delta >= 0 ? '+' : '') + result.delta.toFixed(3) + ' m';
    if (status) status.innerHTML = '<span class="base-depth-status ' + result.status.toLowerCase() + '">' + result.status + '</span>';
  }

  function parseBaseDepthPaste(text) {
    var rows = [];
    String(text || '').replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/).forEach(function(line) {
      var numbers = line.match(/[+-]?\d+(?:[.,]\d+)?/g) || [];
      if (numbers.length < 3) return;
      if (numbers.length >= 4 && /^[1-6]$/.test(numbers[0])) numbers.shift();
      numbers = numbers.map(function(value) { return value.replace(',', '.'); });
      if (numbers.length >= 4) rows.push({ script:numbers[0], real:numbers[1], x:numbers[2], y:numbers[3] });
      else rows.push({ script:numbers[0], real:'', x:numbers[1], y:numbers[2] });
    });
    return rows.slice(0, 6);
  }

  document.addEventListener('paste', function(event) {
    var modal = document.getElementById('baseDepthRecordModal');
    if (!modal || modal.style.display === 'none') return;
    var text = event.clipboardData && event.clipboardData.getData ? event.clipboardData.getData('text/plain') : '';
    if (!text || text.split(/\r?\n/).filter(Boolean).length < 2) return;
    var rows = parseBaseDepthPaste(text);
    if (!rows.length) return;
    event.preventDefault();
    rows.forEach(function(row, index) {
      var point = index + 1;
      ['script','x','y'].forEach(function(field) { var input = getBaseDepthEntryField(baseDepthPasteObstacle,point,field); if (input && row[field] !== '') input.value = row[field]; });
      updateBaseDepthEntryCalc(baseDepthPasteObstacle, point);
    });
    var toast = document.getElementById('copyToast'); toast.innerHTML = '<span style="color:#34d399;font-weight:800;">✓</span><span>' + rows.length + ' rows mapped to ' + baseDepthPasteObstacle + '</span>'; toast.style.display = 'flex'; setTimeout(function(){toast.style.display='none';},1800);
  });

  function collectBaseDepthSection(size) {
    var rows = [];
    for (var point=1; point<=6; point++) rows.push({ point:point, scriptDist:getBaseDepthEntryField(size,point,'script').value.trim(), realDist:String(baseDepthFixedRealDistances[size][point - 1] || ''), distanceStd:getBaseDepthEntryField(size,point,'std').value.trim(), coordX:getBaseDepthEntryField(size,point,'x').value.trim(), coordY:getBaseDepthEntryField(size,point,'y').value.trim(), projector:getBaseDepthEntryField(size,point,'projector').value });
    return rows;
  }

  function appendOptimisticBaseDepthRows(response, payload) {
    var columns = getBaseDepthColumns(response);
    var width = (response.headers || []).length;
    ['3cm', '2.5cm', '2cm'].forEach(function(size) {
      (payload.obstacles[size] || []).forEach(function(entry, index) {
        var row = new Array(width).fill('');
        var calculated = calculateBaseDepthResult(entry.scriptDist, entry.realDist);
        if (index === 0 && size === '3cm') {
          if (columns.robot >= 0) row[columns.robot] = payload.robotId;
          if (columns.date >= 0) row[columns.date] = payload.date;
          if (columns.sw >= 0) row[columns.sw] = payload.swVersion;
          if (columns.tester >= 0) row[columns.tester] = payload.tester;
        }
        if (columns.obstacle >= 0) row[columns.obstacle] = size;
        if (columns.point >= 0) row[columns.point] = index + 1;
        if (columns.scriptDist >= 0) row[columns.scriptDist] = entry.scriptDist;
        if (columns.realDist >= 0) row[columns.realDist] = entry.realDist;
        if (columns.distanceStd >= 0) row[columns.distanceStd] = entry.distanceStd;
        if (columns.coordX >= 0) row[columns.coordX] = entry.coordX;
        if (columns.coordY >= 0) row[columns.coordY] = entry.coordY;
        if (columns.coord >= 0 && (entry.coordX || entry.coordY)) row[columns.coord] = entry.coordX + ', ' + entry.coordY;
        if (columns.accuracy >= 0 && calculated.accuracy !== null) row[columns.accuracy] = calculated.accuracy.toFixed(2) + '%';
        if (columns.delta >= 0 && calculated.delta !== null) row[columns.delta] = calculated.delta.toFixed(3);
        if (columns.projector >= 0) row[columns.projector] = entry.projector;
        if (columns.status >= 0) row[columns.status] = entry.projector || calculated.status;
        response.rows.push(row);
      });
    });
  }

  function restoreBaseDepthDraft(payload) {
    openBaseDepthRecordModal();
    var set = function(id, value) { var field = document.getElementById(id); if (field) field.value = value || ''; };
    set('bd_robot', payload.robotId); set('bd_date', payload.date); set('bd_tester', payload.tester); set('bd_sw', payload.swVersion);
    ['3cm', '2.5cm', '2cm'].forEach(function(size) {
      (payload.obstacles[size] || []).forEach(function(entry, index) {
        var point = index + 1;
        var values = { script:entry.scriptDist, std:entry.distanceStd, x:entry.coordX, y:entry.coordY, projector:entry.projector };
        Object.keys(values).forEach(function(field) {
          var control = getBaseDepthEntryField(size, point, field);
          if (control) control.value = values[field] || '';
        });
      });
    });
  }

  function submitBaseDepthRecord(event) {
    event.preventDefault();
    var form = document.getElementById('baseDepthRecordForm');
    if (form.reportValidity && !form.reportValidity()) return;
    var missingFixed = [];
    ['3cm', '2.5cm', '2cm'].forEach(function(size) {
      for (var point = 1; point <= 6; point++) if (!baseDepthFixedRealDistances[size][point - 1]) missingFixed.push(size + ' point ' + point);
    });
    if (missingFixed.length) {
      handleFail('Fixed real-distance profile is missing for: ' + missingFixed.join(', ') + '. Add the reference values to the Base Depth sheet first.');
      return;
    }
    var payload = {
      sheetName: rawModuleResponse.sheetName,
      robotId: document.getElementById('bd_robot').value,
      date: document.getElementById('bd_date').value.trim(),
      tester: document.getElementById('bd_tester').value.trim(),
      swVersion: document.getElementById('bd_sw').value.trim(),
      obstacles: { '3cm':collectBaseDepthSection('3cm'), '2.5cm':collectBaseDepthSection('2.5cm'), '2cm':collectBaseDepthSection('2cm') }
    };
    localStorage.setItem('last_basedepth_robot', payload.robotId);
    localStorage.setItem('last_basedepth_tester', payload.tester);
    localStorage.setItem('last_basedepth_sw', payload.swVersion);
    var button = document.getElementById('baseDepthSaveButton');
    button.disabled = true;
    button.innerText = 'Saving…';
    var previousResponse = cloneStaticIsoResponse(rawModuleResponse);
    var previousActiveRobotId = activeBaseDepthRobotId;
    var previousActiveObstacle = activeBaseDepthObstacle;
    rawModuleResponse.rows = rawModuleResponse.rows || [];
    appendOptimisticBaseDepthRows(rawModuleResponse, payload);
    activeBaseDepthRobotId = payload.robotId;
    activeBaseDepthObstacle = '3cm';
    closeBaseDepthRecordModal();
    renderSmartModule(rawModuleResponse);

    var rollback = function(error) {
      rawModuleResponse = previousResponse;
      activeBaseDepthRobotId = previousActiveRobotId;
      activeBaseDepthObstacle = previousActiveObstacle;
      renderSmartModule(rawModuleResponse);
      restoreBaseDepthDraft(payload);
      handleFail(error);
    };
    google.script.run.withSuccessHandler(function(response) {
      if (!response || !response.success) {
        rollback(response && response.error ? response.error : 'Base Depth save failed.');
        return;
      }
      activeBaseDepthRobotId = payload.robotId;
      activeBaseDepthObstacle = '3cm';
      saveTabCache('basedepth', { type:'module', data:response.data });
      if (currentTab === 'basedepth') {
        rawModuleResponse = response.data;
        renderSmartModule(response.data);
      }
      setTimeout(function() {
        document.querySelectorAll('.base-depth-master-item').forEach(function(item) {
          if (item.dataset.robotId !== payload.robotId) return;
          item.classList.add('base-depth-imported');
          setTimeout(function() { item.classList.remove('base-depth-imported'); }, 2200);
        });
      }, 30);
    }).withFailureHandler(function(error) {
      rollback(error);
    }).appendBaseDepthRecord(payload);
  }
</script>
