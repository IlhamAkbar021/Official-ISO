<script>

  var lidarSmartDrafts = { accuracy: null, tilt: null };

  // LiDAR owns its add-record entry point so LiDAR labels and behavior stay in this module.

    if (!button) return;
    button.style.display = 'inline-flex';
    button.innerText = '+ Add Record';
    button.setAttribute('onclick', 'openLidarSmartPasteModal()');
  }

          '<option value="accuracy">LiDAR Accuracy Data (Creates 3 Test Runs)</option>' +

        '</select>' +
      '</div>' +

      '<!-- Accuracy Form -->' +
      '<div id="lidar_acc_box">' +
        '<div class="flex-row">' +
          '<div class="form-group" style="flex:1;"><label>Robot ID</label><input type="text" id="l_a_robot" data-static-choice="robot" placeholder="e.g. AC3110 DVT1-1" required></div>' +
          '<div class="form-group" style="flex:1;"><label>Date</label><input type="date" id="l_a_date" value="' + today + '" required>' +

        '<div style="margin-top:0.75rem; padding:0.75rem; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;">' +
          '<div style="font-weight:600; font-size:0.825rem; margin-bottom:0.4rem; color:#4f46e5;">A - 5m Test Inputs</div>' +
          '<div class="flex-row">' +
            '<div class="form-group" style="flex:1;"><label>Distance (m)</label><input type="number" step="0.01" id="l_a5_dist" placeholder="5.03" required></div>' +
            '<div class="form-group" style="flex:1;"><label>STD (m)</label><input type="number" step="0.01" id="l_a5_std" value="0.00" required></div>' +
            '<div class="form-group" style="flex:1;"><label>Valid Points</label><input type="number" id="l_a5_pts" value="9" required></div>' +
          '</div>' +
        '</div>' +

        '<div style="margin-top:0.5rem; padding:0.75rem; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;">' +
          '<div style="font-weight:600; font-size:0.825rem; margin-bottom:0.4rem; color:#4f46e5;">B - 10m Test Inputs</div>' +
          '<div class="flex-row">' +
            '<div class="form-group" style="flex:1;"><label>Distance (m)</label><input type="number" step="0.01" id="l_b10_dist" placeholder="10.02" required></div>' +
            '<div class="form-group" style="flex:1;"><label>STD (m)</label><input type="number" step="0.01" id="l_b10_std" value="0.00" required></div>' +
            '<div class="form-group" style="flex:1;"><label>Valid Points</label><input type="number" id="l_b10_pts" value="9" required></div>' +
          '</div>' +
        '</div>' +

        '<div style="margin-top:0.5rem; padding:0.75rem; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;">' +
          '<div style="font-weight:600; font-size:0.825rem; margin-bottom:0.4rem; color:#4f46e5;">C - 15m Test Inputs</div>' +
          '<div class="flex-row">' +
            '<div class="form-group" style="flex:1;"><label>Distance (m)</label><input type="number" step="0.01" id="l_c15_dist" placeholder="15.01" required></div>' +
            '<div class="form-group" style="flex:1;"><label>STD (m)</label><input type="number" step="0.01" id="l_c15_std" value="0.00" required></div>' +
            '<div class="form-group" style="flex:1;"><label>Valid Points</label><input type="number" id="l_c15_pts" value="9" required></div>' +
          '</div>' +
        '</div>' +

        '<div class="flex-row">' +

          '<div class="form-group" style="flex:1;"><label>Tester Name</label><input type="text" id="l_t_tester" list="registeredTesterList" onfocus="hydrateRegisteredTesterList()" placeholder="e.g. Ilham"></div>' +
        '</div>' +

          '<div class="form-group" style="flex:1;"><label>Number of Bricks</label><input type="number" id="l_t_bricks" placeholder="5" required></div>' +

    if (lidarAccuracyRobot) lidarAccuracyRobot.value = lastLidarRobot;
    if (lidarTiltRobot) lidarTiltRobot.value = lastLidarRobot;
    if (typeof loadRegisteredRobotNames === 'function') loadRegisteredRobotNames();

  function openLidarAccuracyEditModal(rowIndex) {
    isEditing = true;
    activeEditRowIndex = rowIndex;
    activeLidarEditType = 'accuracy';
    
    var row = rawLidarResponse.accuracy.rows[rowIndex] || [];
    
    document.getElementById('modalTitle').innerText = 'Edit Accuracy Record (' + (row[0] || '') + ')';
    document.getElementById('deleteBtn').style.display = 'inline-flex';
    
    document.getElementById('formBody').innerHTML = 
      '<div class="form-group"><label>Robot ID (Read Only)</label><input type="text" value="' + (row[0] || '') + '" disabled style="opacity:0.7;"></div>' +
      '<div class="flex-row">' +
        '<div class="form-group" style="flex:1;"><label>Date</label><input type="date" id="l_a_date" value="' + String(row[1] || '').replace(/\//g,'-') + '">' +
        '<div class="form-group" style="flex:1;"><label>SW Version</label><input type="text" id="l_a_sw" data-static-choice="sw" value="' + (row[2] || '') + '"></div>' +
      '</div>' +
      '<div class="form-group"><label>Tester Name</label><input type="text" id="l_a_tester" list="registeredTesterList" onfocus="hydrateRegisteredTesterList()" value="' + (row[3] || '') + '" required></div>';
    
    document.getElementById('inputModal').style.display = 'flex';

  function openLidarTiltEditModal(rowIndex) {
    isEditing = true;
    activeEditRowIndex = rowIndex;
    activeLidarEditType = 'tilt';
    
    var row = rawLidarResponse.tilt.rows[rowIndex] || [];
    
    document.getElementById('modalTitle').innerText = 'Edit Tilt Record (' + (row[0] || '') + ')';
    document.getElementById('deleteBtn').style.display = 'inline-flex';
    
    document.getElementById('formBody').innerHTML = 
      '<div class="form-group"><label>Robot ID (Read Only)</label><input type="text" value="' + (row[0] || '') + '" disabled style="opacity:0.7;"></div>' +
      '<div class="form-group"><label>Tester Name</label><input type="text" id="l_t_tester" list="registeredTesterList" onfocus="hydrateRegisteredTesterList()" value="' + (row[3] || '') + '" required></div>' +
      '<div class="flex-row">' +
        '<div class="form-group" style="flex:1;"><label>Number of Bricks</label><input type="number" id="l_t_bricks" value="' + (row[4] || '') + '"></div>' +
        '<div class="form-group" style="flex:1;"><label>Detected Distance (m)</label><input type="number" step="0.01" id="l_t_dist" value="' + (row[5] || '') + '"></div>' +
      '</div>';
    
    document.getElementById('inputModal').style.display = 'flex';
  }

  function toggleLidarFields() {
    var type = document.getElementById('l_type').value;
    document.getElementById('lidar_acc_box').style.display = (type === 'accuracy') ? 'block' : 'none';
    document.getElementById('lidar_tilt_box').style.display = (type === 'tilt') ? 'block' : 'none';
  }

  function submitLidarForm() {
    var typeControl = document.getElementById('l_type');
    var lidarType = isEditing ? activeLidarEditType : (typeControl ? typeControl.value : 'accuracy');
    var payload = { lidarType: lidarType };

    if (lidarType === 'accuracy') {
      var accuracyRobot = document.getElementById('l_a_robot');
      payload.robotId = accuracyRobot ? accuracyRobot.value : '';
      payload.date = document.getElementById('l_a_date').value;
      payload.swVer = document.getElementById('l_a_sw').value;
      payload.tester = document.getElementById('l_a_tester').value;

      payload.runA = {
        distance: document.getElementById('l_a5_dist').value,
        std: document.getElementById('l_a5_std').value,
        validPoints: document.getElementById('l_a5_pts').value
      };
      payload.runB = {
        distance: document.getElementById('l_b10_dist').value,
        std: document.getElementById('l_b10_std').value,
        validPoints: document.getElementById('l_b10_pts').value
      };
      payload.runC = {
        distance: document.getElementById('l_c15_dist').value,
        std: document.getElementById('l_c15_std').value,
        validPoints: document.getElementById('l_c15_pts').value
      };
    } else {
      var tiltRobot = document.getElementById('l_t_robot');
      payload.robotId = tiltRobot ? tiltRobot.value : '';
      payload.tester = document.getElementById('l_t_tester').value;
      payload.bricks = document.getElementById('l_t_bricks').value;
      payload.detectedDist = document.getElementById('l_t_dist').value;
    }
    
    if (isEditing) {
      payload.rowIndex = activeEditRowIndex;
      google.script.run.withSuccessHandler(handleSuccess).withFailureHandler(handleFail).updateLidarRecord(payload);
    } else {
      google.script.run.withSuccessHandler(handleSuccess).withFailureHandler(handleFail).addLidarRecord(payload);
    }
  }

  var lidarSmartParsedData = null;

  function getLidarSmartDefaults() {
    var now = new Date();
    var date = now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0');
    var cachedTesters = [];
    var liveTesters = typeof registeredTesterNames !== 'undefined' && Array.isArray(registeredTesterNames) ? registeredTesterNames : [];
    try { cachedTesters = JSON.parse(localStorage.getItem('registered_testers_cache') || '[]'); } catch (e) { cachedTesters = []; }
    return {
      lidarType: typeof activeLidarSubTab !== 'undefined' && activeLidarSubTab === 'tilt' ? 'tilt' : 'accuracy', robotId: localStorage.getItem('last_lidar_robot') || '', date: date, swVer: '',
      tester: localStorage.getItem('last_lidar_tester') || liveTesters[0] || cachedTesters[0] || '',
      runA: { distance:'', std:'0.00', validPoints:'9' }, runB: { distance:'', std:'0.00', validPoints:'9' }, runC: { distance:'', std:'0.00', validPoints:'9' },
      bricks:'', detectedDist:'', heightFrom:'', heightTo:'', tiltStatus:'', angleFrom:'', angleTo:'', note:''
    };
  }

  function normalizeSmartRobotId(value) {
    var match = String(value || '').match(/AC3110[\s_-]*DVT[\s_-]*(\d+)(?:[\s_-]+(\d+))?/i);
    return match ? 'AC3110-DVT' + match[1] + (match[2] ? '-' + match[2] : '') : '';
  }

  function parseClipboardRow(line, delimiter) {
    if (delimiter === '\t') return line.split('\t').map(function(cell) { return cell.trim(); });
    var cells = [], current = '', quoted = false;
    for (var i = 0; i < line.length; i++) {
      var char = line.charAt(i);
      if (char === '"' && quoted && line.charAt(i + 1) === '"') { current += '"'; i++; }
      else if (char === '"') quoted = !quoted;
      else if (char === ',' && !quoted) { cells.push(current.trim()); current = ''; }
      else current += char;
    }
    cells.push(current.trim());
    return cells;
  }

  function normalizeClipboardHeader(value) {
    return String(value || '').toLowerCase().replace(/[()]/g, ' ').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function findClipboardColumn(headers, pattern) {
    for (var i = 0; i < headers.length; i++) if (pattern.test(headers[i])) return i;
    return -1;
  }

  function clipboardCell(row, index) { return index >= 0 && row && row[index] !== undefined ? String(row[index]).trim() : ''; }

  function parseLidarTabularText(text, result) {
    var lines = String(text || '').split(/\r?\n/).map(function(line) { return line.trim(); }).filter(Boolean);
    if (!lines.length) return false;
    var delimiter = lines.some(function(line) { return line.indexOf('\t') !== -1; }) ? '\t' : ',';
    if (delimiter === ',' && lines.length === 1 && lines[0].indexOf(',') === -1) return false;
    var rows = lines.map(function(line) { return parseClipboardRow(line, delimiter); });
    var headers = rows[0].map(normalizeClipboardHeader);
    var hasHeader = headers.some(function(header) { return /robot|tester|operator|distance|range|angle|brick|software|sw ver|date/.test(header); });
    if (!hasHeader) {
      var values = rows[0];
      var robot = normalizeSmartRobotId(values[0]);
      if (!robot) return false;
      result.robotId = robot;
      result.date = values[1] || result.date;
      result.swVer = values[2] || result.swVer;
      result.tester = values[3] || result.tester;
      if (values.length >= 7) {
        result.lidarType = 'accuracy'; result.runA.distance = values[4] || ''; result.runB.distance = values[5] || ''; result.runC.distance = values[6] || '';
      }
      return true;
    }
    var dataRows = rows.slice(1);
    if (!dataRows.length) return false;
    var robotIndex = findClipboardColumn(headers, /robot|unit|serial/);
    var dateIndex = findClipboardColumn(headers, /^date$|test date/);
    var swIndex = findClipboardColumn(headers, /software|sw ver|release/);
    var testerIndex = findClipboardColumn(headers, /tester|operator|engineer/);
    var optionIndex = findClipboardColumn(headers, /option|target|range/);
    var distanceIndex = findClipboardColumn(headers, /^distance|measured distance|actual dist/);
    var offsetIndex = findClipboardColumn(headers, /offset|std|deviation|diff/);
    var samplesIndex = findClipboardColumn(headers, /sample|valid point|count/);
    var fiveIndex = findClipboardColumn(headers, /(^|\s)5\s*m|a\s*5/);
    var tenIndex = findClipboardColumn(headers, /(^|\s)10\s*m|b\s*10/);
    var fifteenIndex = findClipboardColumn(headers, /(^|\s)15\s*m|c\s*15/);
    var first = dataRows[0];
    result.robotId = normalizeSmartRobotId(clipboardCell(first, robotIndex)) || result.robotId;
    result.date = clipboardCell(first, dateIndex) || result.date;
    result.swVer = clipboardCell(first, swIndex) || result.swVer;
    result.tester = clipboardCell(first, testerIndex) || result.tester;
    if (fiveIndex >= 0 || tenIndex >= 0 || fifteenIndex >= 0 || (optionIndex >= 0 && distanceIndex >= 0)) {
      result.lidarType = 'accuracy';
      result.runA.distance = clipboardCell(first, fiveIndex) || result.runA.distance;
      result.runB.distance = clipboardCell(first, tenIndex) || result.runB.distance;
      result.runC.distance = clipboardCell(first, fifteenIndex) || result.runC.distance;
      if (optionIndex >= 0 && distanceIndex >= 0) dataRows.forEach(function(row) {
        var option = clipboardCell(row, optionIndex).toLowerCase();
        var distance = clipboardCell(row, distanceIndex);
        var run = null;
        if (/(^|\D)5\s*m|a\s*-?\s*5/.test(option)) run = result.runA;
        else if (/(^|\D)10\s*m|b\s*-?\s*10/.test(option)) run = result.runB;
        else if (/(^|\D)15\s*m|c\s*-?\s*15/.test(option)) run = result.runC;
        if (run) {
          run.distance = distance;
          run.std = clipboardCell(row, offsetIndex) || run.std;
          run.validPoints = clipboardCell(row, samplesIndex) || run.validPoints;
        }
      });
      return true;
    }
    result.lidarType = 'tilt';
    result.bricks = clipboardCell(first, findClipboardColumn(headers, /brick/));
    result.detectedDist = clipboardCell(first, findClipboardColumn(headers, /detected distance|distance/));
    result.heightFrom = clipboardCell(first, findClipboardColumn(headers, /height from/));
    result.heightTo = clipboardCell(first, findClipboardColumn(headers, /height to/));
    result.tiltStatus = clipboardCell(first, findClipboardColumn(headers, /tilt status|status/));
    result.angleFrom = clipboardCell(first, findClipboardColumn(headers, /angle from|min angle/));
    result.angleTo = clipboardCell(first, findClipboardColumn(headers, /angle to|max angle/));
    result.note = clipboardCell(first, findClipboardColumn(headers, /note|link|evidence/));
    return true;
  }

  function matchClipboardValue(text, pattern) {
    var match = String(text || '').match(pattern);
    return match && match[1] !== undefined ? match[1].trim() : '';
  }

  function parseLidarSequentialDump(text, result) {
    var lines = String(text || '').replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/).map(function(line) { return line.trim(); }).filter(Boolean);
    var candidates = [];
    lines.forEach(function(line) {
      if (/robot|tester|operator|engineer|software|sw\s*ver|date|measured.*offset|target.*sample/i.test(line)) return;
      var numericTokens = line.match(/[+-]?\d+(?:[.,]\d+)?/g) || [];
      var plainNumber = /^\s*[\[({]?\s*[+-]?\d+(?:[.,]\d+)?\s*[\])}]?\s*$/.test(line);
      if (plainNumber && numericTokens.length === 1) {
        candidates.push({ measured:numericTokens[0], offset:'0.00', samples:'9' });
      } else if (numericTokens.length >= 3 && (/\t|\s{2,}|\||\[|\]|(?:A|B|C)\s*-?\s*(?:5|10|15)\s*M?|(?:5|10|15)\s*M\s*[:=]/i.test(line) || /^[\s\d+\-.,\[\](){}]+$/.test(line))) {
        var values = numericTokens.slice(-3);
        candidates.push({ measured:values[0], offset:values[1], samples:values[2] });
      }
    });
    if (candidates.length < 3) return false;
    var targets = [5, 10, 15];
    var sequence = null;
    for (var start = 0; start <= candidates.length - 3; start++) {
      var windowRows = candidates.slice(start, start + 3);
      var plausible = windowRows.every(function(row, index) {
        var measured = parseFloat(String(row.measured).replace(',', '.'));
        return isFinite(measured) && Math.abs(measured - targets[index]) <= 2;
      });
      if (plausible) { sequence = windowRows; break; }
    }
    if (!sequence) return false;
    var runs = [result.runA, result.runB, result.runC];
    sequence.forEach(function(row, index) {
      runs[index].distance = String(row.measured).replace(',', '.');
      runs[index].std = String(row.offset).replace(',', '.');
      runs[index].validPoints = String(Math.max(0, parseInt(row.samples, 10) || 0));
    });
    result.lidarType = 'accuracy';
    return true;
  }

  function parseLidarClipboard(text) {
    var result = getLidarSmartDefaults();
    var source = String(text || '').trim();
    if (!source) return result;
    parseLidarTabularText(source, result);
    parseLidarSequentialDump(source, result);
    result.robotId = normalizeSmartRobotId(source) || result.robotId;
    result.swVer = matchClipboardValue(source, /(?:sw(?:\s*version|\s*ver)?|software(?:\s*version)?)\s*[:=]\s*([^\s,;]+)/i) || result.swVer;
    result.tester = matchClipboardValue(source, /(?:tester|operator|engineer)\s*[:=]\s*([^\n,;]+)/i) || result.tester;
    var date = matchClipboardValue(source, /(?:date|tested\s*at)\s*[:=]\s*(20\d{2}[\/-](?:0?[1-9]|1[0-2])[\/-](?:0?[1-9]|[12]\d|3[01]))/i);
    if (date) result.date = date.replace(/-/g, '/');
    var d5 = matchClipboardValue(source, /(?:target\s*)?5\s*m(?:eter)?\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)/i);
    var d10 = matchClipboardValue(source, /(?:target\s*)?10\s*m(?:eter)?\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)/i);
    var d15 = matchClipboardValue(source, /(?:target\s*)?15\s*m(?:eter)?\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)/i);
    if (d5 || d10 || d15) {
      result.lidarType = 'accuracy';
      result.runA.distance = d5.replace(',', '.') || result.runA.distance;
      result.runB.distance = d10.replace(',', '.') || result.runB.distance;
      result.runC.distance = d15.replace(',', '.') || result.runC.distance;
    }
    if (/tilt|angle|brick|height/i.test(source) && !(d5 || d10 || d15)) result.lidarType = 'tilt';
    result.bricks = matchClipboardValue(source, /(?:bricks?|number\s*of\s*bricks?)\s*[:=]\s*(\d+)/i) || result.bricks;
    result.detectedDist = matchClipboardValue(source, /(?:detected\s*distance|distance)\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)/i).replace(',', '.') || result.detectedDist;
    result.heightFrom = matchClipboardValue(source, /height\s*from\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)/i).replace(',', '.') || result.heightFrom;
    result.heightTo = matchClipboardValue(source, /height\s*to\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)/i).replace(',', '.') || result.heightTo;
    result.tiltStatus = matchClipboardValue(source, /(?:tilt\s*status|status)\s*[:=]\s*([^\n,;]+)/i) || result.tiltStatus;
    result.angleFrom = matchClipboardValue(source, /(?:angle\s*from|min(?:imum)?\s*angle|tilt\s*angle)\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)/i).replace(',', '.') || result.angleFrom;
    result.angleTo = matchClipboardValue(source, /(?:angle\s*to|max(?:imum)?\s*angle)\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)/i).replace(',', '.') || result.angleTo;
    var range = source.match(/angle\s*range\s*[:=]\s*([+-]?\d+(?:[.,]\d+)?)\s*(?:-|–|to)\s*([+-]?\d+(?:[.,]\d+)?)/i);
    if (range) { result.angleFrom = range[1].replace(',', '.'); result.angleTo = range[2].replace(',', '.'); result.lidarType = 'tilt'; }
    result.note = matchClipboardValue(source, /(?:note|evidence|link)\s*[:=]\s*([^\n]+)/i) || result.note;
    return result;
  }

  function ensureLidarSmartImportModal() {
    var modal = document.getElementById('lidarSmartImportModal');
    if (modal) return modal;
    modal = document.createElement('div');
    modal.id = 'lidarSmartImportModal';
    modal.className = 'modal-overlay lidar-smart-import-overlay';
    modal.onclick = function(event) { if (event.target === modal) closeLidarSmartImportModal(); };
    modal.innerHTML = '<div class="lidar-smart-import-panel" role="dialog" aria-modal="true" aria-labelledby="lidarSmartImportTitle"><header><div><h3 id="lidarSmartImportTitle">Add Record</h3><p>Enter or paste the 5 m, 10 m and 15 m sequence before writing to Google Sheets.</p></div><button type="button" class="modal-close-x" onclick="closeLidarSmartImportModal()" aria-label="Close">×</button></header><label class="smart-paste-source"><span>Robot output / clipboard</span><textarea id="lidarSmartSource" rows="3" placeholder="5.02  0.00  8&#10;10.02  0.00  8&#10;15.02  0.00  8" oninput="parseLidarSmartPasteSource()" onkeydown="if((event.ctrlKey||event.metaKey)&&event.key===\'Enter\'){event.preventDefault();commitLidarSmartImport(event);}"></textarea></label><form id="lidarSmartImportForm" onsubmit="commitLidarSmartImport(event)"><div id="lidarSmartPreview"></div><div class="lidar-smart-import-actions"><span>Enter saves · Ctrl/Cmd+Enter works from the paste box</span><button type="submit" class="btn-action" id="lidarSmartCommit">Save Record</button></div></form></div>';
    document.body.appendChild(modal);
    return modal;
  }

  function openLidarSmartPasteModal(sourceText) {
    loadRegisteredRobotNames();
    var modal = ensureLidarSmartImportModal();
    var source = document.getElementById('lidarSmartSource');
    // Accuracy and optional Tilt & Angle inputs share one combined form.
    var selectedType = 'accuracy';
    lidarSmartDrafts = { accuracy: null, tilt: null };
    source.value = sourceText || '';
    lidarSmartParsedData = parseLidarClipboard(source.value);
    lidarSmartParsedData.lidarType = selectedType;
    renderLidarSmartPreview();
    modal.style.display = 'flex';
    var subtitle = modal.querySelector('header p');
    if (subtitle) subtitle.innerText = 'Enter shared robot details once, then add Accuracy and/or Tilt & Angle values below.';
    source.placeholder = selectedType === 'tilt'
      ? 'Optional robot output or notes for the Tilt & Angle record'
      : '5.02  0.00  8\n10.02  0.00  8\n15.02  0.00  8';
    var smartTitle = document.getElementById('lidarSmartImportTitle');
    if (smartTitle) smartTitle.innerText = 'Add Record';
    setTimeout(function() {
      var focusTarget = source.value ? document.getElementById('smart_robot_id') : source;
      if (focusTarget) { focusTarget.focus(); if (focusTarget.select) focusTarget.select(); }
    }, 0);
  }

  function closeLidarSmartImportModal() {
    var modal = document.getElementById('lidarSmartImportModal');
    if (modal) modal.style.display = 'none';
  }

  function parseLidarSmartPasteSource() {
    var selectedType = 'accuracy';
    lidarSmartParsedData = parseLidarClipboard(document.getElementById('lidarSmartSource').value);
    lidarSmartParsedData.lidarType = selectedType;
    renderLidarSmartPreview();
  }

  function smartImportInput(id, label, value, type, attrs) {
    var dateField = id === 'smart_date';
    var inputType = dateField ? 'date' : (type || 'text');
    var dateValue = dateField ? String(value || '').replace(/\//g, '-') : value;
    return '<label><span>' + label + '</span><input id="' + id + '" type="' + inputType + '" value="' + escapeHtml(dateValue || '') + '" ' + (attrs || '') + '></label>';
  }

  function renderLidarSequenceRow(key, label, target, run) {
    return '<tr><th scope="row"><strong>' + label + '</strong><small>Target ' + target.toFixed(1) + ' m</small></th>' +
      '<td class="sequence-target">' + target.toFixed(1) + ' m</td>' +
      '<td><input id="smart_' + key + 'm" type="number" step="0.01" value="' + escapeHtml(run.distance || '') + '" placeholder="' + target.toFixed(2) + '" oninput="updateLidarSmartPreviewBadges()"><input id="smart_' + key + 'm_offset" type="hidden" value="' + escapeHtml(run.std || '') + '"></td>' +
      '<td id="smart_delta_' + key + '" class="sequence-delta">—</td>' +
      '<td><input id="smart_' + key + 'm_samples" type="number" min="1" step="1" value="' + escapeHtml(run.validPoints || '') + '"></td>' +
      '<td id="smart_status_' + key + '"><span class="smart-awaiting-value">Awaiting</span></td></tr>';
  }

  function renderLidarSmartPreview() {
    var data = lidarSmartParsedData || getLidarSmartDefaults();
    var testerAttrs = 'list="registeredTesterList"';
    var commonFields = smartImportInput('smart_robot_id','Robot ID',data.robotId,'text','required pattern="AC3110-DVT[0-9]+(-[0-9]+)?" data-static-choice="robot"') + smartImportInput('smart_date','Date',data.date,'text','required') + smartImportInput('smart_sw','SW Version',data.swVer,'text','data-static-choice="sw"') + smartImportInput('smart_tester','Tester',data.tester,'text',testerAttrs);
    var html = '<div class="smart-import-type"><div class="smart-import-mode"><span>Shared record details</span><strong>Used for Accuracy + Tilt</strong></div><span class="smart-parser-state">Enter common details once</span></div>' +
      '<div class="smart-import-common">' + commonFields + '</div>' +
      '<section class="smart-import-section"><div class="smart-import-section-heading"><div><strong>Accuracy Collection</strong><span>5 m · 10 m · 15 m</span></div><small>Optional if adding Tilt only</small></div>' +
      '<div class="smart-sequence-wrap"><table class="smart-sequence-table"><thead><tr><th>Sequence</th><th>Target</th><th>Measured (m)</th><th>Delta / Diff</th><th>Samples</th><th>Auto-status</th></tr></thead><tbody>' +
      renderLidarSequenceRow('5','A - 5M',5,data.runA) + renderLidarSequenceRow('10','B - 10M',10,data.runB) + renderLidarSequenceRow('15','C - 15M',15,data.runC) + '</tbody></table><p class="sequence-help">Tolerance: Pass when |Measured − Target| ≤ 0.05 m. Clipboard offset is preserved for the sheet STD/Offset column.</p></div></section>' +
      '<section class="smart-import-section smart-import-tilt-section"><div class="smart-import-section-heading"><div><strong>Tilt &amp; Angle</strong><span>Optional · saved to the same robot record</span></div><small>Fill only the fields you have</small></div>' +
      '<div class="smart-import-tilt">' + smartImportInput('smart_bricks','Bricks',data.bricks,'number','min="0" max="8" step="1"') + smartImportInput('smart_detected','Detected Distance (m)',data.detectedDist,'number','step="0.01"') + smartImportInput('smart_note','Note / Link',data.note) + '</div></section>';
    document.getElementById('lidarSmartPreview').innerHTML = html;
    var commitButton = document.getElementById('lidarSmartCommit');
    if (commitButton) commitButton.innerText = 'Save Record';
    updateLidarSmartPreviewBadges();
  }

  function collectLidarSmartForm(forcedType) {
    var value = function(id) { var field = document.getElementById(id); return field ? field.value.trim() : ''; };
    var data = getLidarSmartDefaults();
    data.lidarType = 'accuracy';
    data.robotId = normalizeSmartRobotId(value('smart_robot_id')) || value('smart_robot_id').toUpperCase();
    data.date = value('smart_date'); data.swVer = value('smart_sw'); data.tester = value('smart_tester') || 'Unassigned';
    data.runA.distance = value('smart_5m'); data.runA.std = value('smart_5m_offset') || '0.00'; data.runA.validPoints = value('smart_5m_samples');
    data.runB.distance = value('smart_10m'); data.runB.std = value('smart_10m_offset') || '0.00'; data.runB.validPoints = value('smart_10m_samples');
    data.runC.distance = value('smart_15m'); data.runC.std = value('smart_15m_offset') || '0.00'; data.runC.validPoints = value('smart_15m_samples');
    data.bricks = value('smart_bricks'); data.detectedDist = value('smart_detected'); data.note = value('smart_note');
    data.includeAccuracy = [data.runA.distance, data.runB.distance, data.runC.distance].some(function(v) { return v !== ''; });
    data.includeTilt = [data.bricks, data.detectedDist, data.note].some(function(v) { return v !== ''; });
    return data;
  }

  function changeLidarSmartType(type) {
    // The select already contains the new value when onchange runs. Detect the
    // form that is currently rendered so the previous draft is saved correctly.
    var currentType = document.getElementById('smart_5m') ? 'accuracy' : 'tilt';
    if (document.getElementById('smart_robot_id')) {
      lidarSmartDrafts[currentType] = collectLidarSmartForm(currentType);
    }
    var nextType = type === 'tilt' ? 'tilt' : 'accuracy';
    lidarSmartParsedData = lidarSmartDrafts[nextType] || Object.assign({}, getLidarSmartDefaults(), { lidarType: nextType });
    lidarSmartParsedData.lidarType = nextType;
    renderLidarSmartPreview();
  }

  function updateLidarSmartPreviewBadges() {
    var type = lidarSmartParsedData && lidarSmartParsedData.lidarType || (typeof activeLidarSubTab !== 'undefined' && activeLidarSubTab === 'tilt' ? 'tilt' : 'accuracy');
    if (type === 'accuracy') {
      [[5,'smart_5m','smart_delta_5','smart_status_5'],[10,'smart_10m','smart_delta_10','smart_status_10'],[15,'smart_15m','smart_delta_15','smart_status_15']].forEach(function(item) {
        var field = document.getElementById(item[1]);
        var deltaCell = document.getElementById(item[2]);
        var statusCell = document.getElementById(item[3]);
        var measured = field && field.value !== '' ? parseFloat(field.value) : NaN;
        if (isFinite(measured)) {
          var delta = measured - item[0];
          var state = Math.abs(delta) <= LIDAR_ISO_TOLERANCE_M + 1e-9 ? 'pass' : 'fail';
          if (deltaCell) { deltaCell.innerText = (delta >= 0 ? '+' : '') + delta.toFixed(2) + ' m'; deltaCell.className = 'sequence-delta state-' + state; }
          if (statusCell) statusCell.innerHTML = '<span class="smart-tolerance-badge state-' + state + '">' + (state === 'pass' ? 'Pass' : 'Fail') + '</span>';
        } else {
          if (deltaCell) { deltaCell.innerText = '—'; deltaCell.className = 'sequence-delta'; }
          if (statusCell) statusCell.innerHTML = '<span class="smart-awaiting-value">Awaiting</span>';
        }
      });
    } else {
      var bricks = document.getElementById('smart_bricks');
      var from = document.getElementById('smart_angle_from');
      var to = document.getElementById('smart_angle_to');
      var range = document.getElementById('smart_tilt_range');
      var heightFrom = document.getElementById('smart_height_from');
      var heightTo = document.getElementById('smart_height_to');
      var status = document.getElementById('smart_tilt_status');
      var brickCount = bricks && bricks.value !== '' ? Number(bricks.value) : NaN;
      var profile = null;
      if (isFinite(brickCount) && brickCount >= 0 && brickCount <= 8 && Math.floor(brickCount) === brickCount) {
        profile = {
          from: Number(((brickCount - 4) * 0.38).toFixed(2)),
          to: Number(((brickCount - 3) * 0.38).toFixed(2)),
          heightFrom: (brickCount - 1) * 10,
          heightTo: brickCount * 10,
          status: brickCount < 4 ? 'Tilt Down, Acceptable' : (brickCount === 4 ? 'Normal' : (brickCount === 5 ? 'Tilt Up, but Acceptable' : 'Tilt Up, Not Acceptable'))
        };
      }
      if (profile) {
        if (heightFrom) heightFrom.value = profile.heightFrom;
        if (heightTo) heightTo.value = profile.heightTo;
        if (from) from.value = profile.from;
        if (to) to.value = profile.to;
        if (status) status.value = profile.status;
      }
      if (range) range.innerHTML = formatLidarAngle(from && from.value) + ' – ' + formatLidarAngle(to && to.value);
    }
  }

  function commitLidarSmartImport(event) {
    if (event) event.preventDefault();
    var form = document.getElementById('lidarSmartImportForm');
    if (form && form.reportValidity && !form.reportValidity()) return;
    var payload = collectLidarSmartForm();
    if (!/^AC3110-DVT\d+(?:-\d+)?$/i.test(payload.robotId)) { alert('Robot ID must match AC3110-DVTn or AC3110-DVTn-n.'); return; }
    if (!payload.includeAccuracy && !payload.includeTilt) { alert('Enter at least one Accuracy value or one Tilt & Angle value before saving.'); return; }
    if (payload.includeTilt && !payload.bricks && !payload.detectedDist) { alert('Enter Bricks or Detected Distance to save Tilt & Angle.'); return; }
    if (payload.includeTilt && payload.bricks !== '' && (!Number.isInteger(Number(payload.bricks)) || Number(payload.bricks) < 0 || Number(payload.bricks) > 8)) { alert('Bricks must be a whole number from 0 to 8.'); return; }
    localStorage.setItem('last_lidar_tester', payload.tester);
    localStorage.setItem('last_lidar_robot', payload.robotId);
    var button = document.getElementById('lidarSmartCommit');
    button.disabled = true; button.innerText = 'Importing…';
    var previousResponse = cloneStaticIsoResponse(rawLidarResponse);
    var previousSubTab = activeLidarSubTab;
    var optimisticIndex = payload.includeAccuracy ? rawLidarResponse.accuracy.rows.length : 0;
    var optimisticData = { action:'updateLidarRow' };
    if (payload.includeAccuracy) optimisticData.accuracyPayload = payload;
    if (payload.includeTilt) optimisticData.tiltPayload = payload;
    applyOptimisticLidarSave(optimisticData, optimisticIndex);
    // Keep the user's current view. Combined records may contain accuracy
    // values while the user is working in the Tilt & Angle table.
    activeLidarSubTab = previousSubTab;
    closeLidarSmartImportModal();
    renderSubPills();
    renderSplitLidarTable(rawLidarResponse);

    var rollback = function(error) {
      rawLidarResponse = previousResponse;
      activeLidarSubTab = previousSubTab;
      renderSubPills();
      renderSplitLidarTable(rawLidarResponse);
      lidarSmartParsedData = payload;
      var modal = ensureLidarSmartImportModal();
      var source = document.getElementById('lidarSmartSource');
      if (source) source.value = '';
      renderLidarSmartPreview();
      modal.style.display = 'flex';
      alert('Smart Import Error: ' + (error && error.message ? error.message : error));
    };
    google.script.run.withSuccessHandler(function(response) {
      if (!response || !response.success) { rollback(response && response.error ? response.error : 'Unknown error'); return; }
      recentLidarImportRobotId = payload.robotId;
      recentLidarImportDate = payload.date;
      recentLidarImportStartIndex = response.imported && response.imported.firstRow ? Number(response.imported.firstRow) - 3 : null;
      saveTabCache('lidar', { type:'lidar', data:response.data });
      if (currentTab === 'lidar') {
        rawLidarResponse = response.data;
        activeLidarSubTab = previousSubTab;
        renderSubPills();
        renderSplitLidarTable(response.data);
      }
      highlightImportedLidarRow(payload.robotId, payload.date, recentLidarImportStartIndex);
      var toast = document.getElementById('copyToast');
      toast.innerHTML = '<span style="color:#34d399;font-weight:800;">✓</span><span>LiDAR record imported</span>';
      toast.style.display = 'flex'; setTimeout(function() { toast.style.display = 'none'; }, 2200);
    }).withFailureHandler(function(error) {
      rollback(error);
    }).smartImportLidarRecord(payload);
  }

  function highlightImportedLidarRow(robotId, recordDate, sourceIndex) {
    setTimeout(function() {
      var rows = document.querySelectorAll('.lidar-inspection-table tbody tr[data-robot-id]');
      var matchedRow = Array.prototype.slice.call(rows).find(function(row) { return sourceIndex !== null && sourceIndex !== undefined && Number(row.dataset.sourceIndex) === sourceIndex; }) ||
        Array.prototype.slice.call(rows).find(function(row) { return row.dataset.robotId === robotId && (!recordDate || row.dataset.recordDate === recordDate); }) ||
        Array.prototype.slice.call(rows).find(function(row) { return row.dataset.robotId === robotId; });
      if (!matchedRow) return;
      matchedRow.classList.add('lidar-row-imported');
      matchedRow.scrollIntoView({ block:'nearest', behavior:'smooth' });
      setTimeout(function() { matchedRow.classList.remove('lidar-row-imported'); }, 2200);
    }, 40);
  }

  document.addEventListener('paste', function(event) {
    if (currentTab !== 'lidar') return;
    var target = event.target;
    var tag = target && target.tagName ? target.tagName.toUpperCase() : '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (target && target.isContentEditable)) return;
    var text = event.clipboardData && event.clipboardData.getData ? event.clipboardData.getData('text/plain') : '';
    if (!text || !text.trim()) return;
    event.preventDefault();
    openLidarSmartPasteModal(text);
  });

  function submitForm(e) {
    e.preventDefault();
    var saveBtn = document.getElementById('saveBtn');
    saveBtn.innerText = 'Saving...';
    saveBtn.disabled = true;

    if (isGenericModule(currentTab)) { submitGenericModuleForm(); }
    else if (currentTab === 'wifi') { submitWifiForm(); } 
    else { submitLidarForm(); }
  }
</script>
